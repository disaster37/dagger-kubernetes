version: "3.9"

services:
  supervisor:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - DAGGER_KUBERNETES_SERVER_CONTROL_ADDR=:8080
      - DAGGER_KUBERNETES_SERVER_DATA_ADDR=:8443
      - DAGGER_KUBERNETES_SERVER_DATA_HOSTNAME=localhost
      - DAGGER_KUBERNETES_SERVER_PUBLIC_URL=http://localhost:8080
      - DAGGER_KUBERNETES_TELEMETRY_COLLECTOR_URL=http://otel-collector:4318
      - DAGGER_KUBERNETES_TELEMETRY_TEMPO_URL=http://tempo:3200
      - DAGGER_KUBERNETES_TELEMETRY_LOKI_URL=http://loki:3100
      - DAGGER_KUBERNETES_TELEMETRY_VICTORIA_URL=http://victoria:8428
      - DAGGER_KUBERNETES_CACHE_BACKEND=registry
      - DAGGER_KUBERNETES_CACHE_REGISTRY=localhost:5000/dagger-cache
      - DAGGER_KUBERNETES_TLS_CA_PATH=/tmp/dagger-kubernetes/ca
      - DAGGER_KUBERNETES_LOG_LEVEL=debug
      - DAGGER_KUBERNETES_DATABASE_DIR=/var/lib/dagger-kubernetes
      - DAGGER_KUBERNETES_RAFT_BIND_ADDR=:8081
      # Set a bootstrap admin password explicitly in production; empty = random
      # password logged once at first boot.
      - DAGGER_KUBERNETES_AUTH_BOOTSTRAP_ADMIN_PASSWORD=
    volumes:
      # Generate your own bearer token and write it to ./data/tokens before
      # starting the stack, e.g.:
      #   mkdir -p data && head -c 32 /dev/urandom | xxd -p -u > data/tokens
      # The tokens file is gitignored and must never be committed.
      # This is the legacy flat-file bearer fallback (dev only). Production
      # uses per-user API tokens created from the UI (see docs/README.md).
      - ./data/tokens:/etc/dagger-kubernetes/tokens:ro
      # Raft data directory (raft.db, snapshots/, node-id). Fresh-start store.
      - ./data:/var/lib/dagger-kubernetes
    depends_on:
      - cache-registry
    networks:
      - dagger-kubernetes

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.127.0
    ports:
      - "4318:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otel/config.yaml
    networks:
      - dagger-kubernetes

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    networks:
      - dagger-kubernetes

  loki:
    image: grafana/loki:3.6.3
    ports:
      - "3101:3100"
    networks:
      - dagger-kubernetes

  victoria:
    image: victoriametrics/victoria-metrics:v1.119.0
    ports:
      - "8428:8428"
    volumes:
      - victoria-data:/victoria-metrics-data
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=30d
    networks:
      - dagger-kubernetes

  grafana:
    image: grafana/grafana:11.6.2
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
    networks:
      - dagger-kubernetes

  cache-registry:
    image: registry:2
    ports:
      - "5000:5000"
    environment:
      - REGISTRY_STORAGE_DELETE_ENABLED=true
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - dagger-kubernetes

networks:
  dagger-kubernetes:

volumes:
  registry-data:
  victoria-data:
