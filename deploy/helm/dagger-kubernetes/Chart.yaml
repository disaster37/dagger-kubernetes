apiVersion: v2
name: dagger-kubernetes
description: Self-hosted, Dagger-Cloud-compatible platform — remote shared cache, auto-scaling engine fleets, live pipeline UI, and drop-in CI integration.
type: application
version: 0.1.0
appVersion: "0.1.0"
home: https://github.com/disaster37/dagger-kubernetes
sources:
  - https://github.com/disaster37/dagger-kubernetes
maintainers:
  - name: disaster
keywords:
  - dagger
  - ci
  - cache
  - buildkit
  - kubernetes
dependencies:
  - name: opentelemetry-collector
    version: "0.108.0"
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: opentelemetry-collector.enabled
  - name: docker-registry
    alias: registry
    version: "3.0.0"
    repository: https://twuni.github.io/docker-registry.helm
    condition: registry.enabled
  - name: tempo
    version: "1.24.4"
    repository: https://grafana.github.io/helm-charts
    condition: tempo.enabled
  - name: loki
    version: "7.2.0"
    repository: https://grafana.github.io/helm-charts
    condition: loki.enabled
  - name: victoria-metrics-single
    alias: victoria
    version: "0.44.0"
    repository: https://victoriametrics.github.io/helm-charts/
    condition: victoria.enabled
  - name: grafana
    version: "10.5.15"
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
