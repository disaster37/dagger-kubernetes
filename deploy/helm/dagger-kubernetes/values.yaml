# dagger-kubernetes Helm chart values
# ---------------------------------------------------------------------------
# Copy to your own values file and override as needed, e.g.:
#   helm install dagger-kubernetes ./deploy/helm/dagger-kubernetes -f my-values.yaml

## @section Chart metadata

## @param nameOverride [string] Override the chart name used in resource labels.
nameOverride: ""
## @param fullnameOverride [string] Override the full name of the release.
fullnameOverride: ""
## @param namespace [string] Namespace for the supervisor and subchart dependencies. Defaults to the release namespace when empty.
namespace: ""

## @section Supervisor (control-plane pod)

## @param supervisor.image.repository Supervisor container image repository.
## @param supervisor.image.tag Image tag (empty defaults to Chart.appVersion).
## @param supervisor.image.pullPolicy Image pull policy.
## @param supervisor.image.pullSecrets [array] Image pull secrets for private registries.
supervisor:
  image:
    repository: ghcr.io/disaster37/dagger-kubernetes
    tag: ""
    pullPolicy: IfNotPresent
    pullSecrets: []
## @param supervisor.replicaCount Number of supervisor replicas. Multi-node Raft
## requires an odd number >= 3 for quorum fault tolerance (a 2-node cluster has
## no failure tolerance). Keep in sync with supervisor.config.raft.replicas.
  replicaCount: 3
## @param supervisor.resources.requests.cpu Supervisor CPU request.
## @param supervisor.resources.requests.memory Supervisor memory request.
## @param supervisor.resources.limits.cpu Supervisor CPU limit.
## @param supervisor.resources.limits.memory Supervisor memory limit.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
## @param supervisor.persistence.enabled Enable a per-pod PVC for the Raft data directory (StatefulSet volumeClaimTemplate). disabled = emptyDir (dev only).
## @param supervisor.persistence.storageClass StorageClass for the supervisor PVC (empty = cluster default).
## @param supervisor.persistence.size PVC size for each supervisor pod's Raft data directory.
  persistence:
    enabled: true
    storageClass: ""
    size: 2Gi
## @param supervisor.podAnnotations [object] Annotations added to the supervisor pod.
  podAnnotations: {}
## @param supervisor.podSecurityContext.runAsNonRoot Run supervisor container as non-root.
## @param supervisor.podSecurityContext.runAsUser User ID for the supervisor container.
## @param supervisor.podSecurityContext.runAsGroup Group ID for the supervisor container.
## @param supervisor.podSecurityContext.fsGroup Filesystem group for mounted volumes.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
## @param supervisor.securityContext.allowPrivilegeEscalation Allow privilege escalation.
## @param supervisor.securityContext.readOnlyRootFilesystem Mount root filesystem as read-only.
## @param supervisor.securityContext.capabilities.drop [array] Linux capabilities to drop.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
## @param supervisor.nodeSelector [object] Node selector for supervisor pod scheduling.
  nodeSelector: {}
## @param supervisor.tolerations [array] Tolerations for supervisor pod scheduling.
  tolerations: []
## @param supervisor.affinity [object] Affinity rules for supervisor pod scheduling.
  affinity: {}
## @param supervisor.autoscaling.enabled Enable HPA for supervisor.
## @param supervisor.autoscaling.minReplicas Minimum replicas for HPA.
## @param supervisor.autoscaling.maxReplicas Maximum replicas for HPA.
## @param supervisor.autoscaling.targetCPUUtilizationPercentage Target CPU utilization for HPA.
## @param supervisor.autoscaling.targetMemoryUtilizationPercentage Target memory utilization for HPA.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: ""
## @param supervisor.serviceAccount.annotations [object] Annotations for the supervisor ServiceAccount.
## @param supervisor.serviceAccount.clusterScope Use ClusterRole instead of namespaced Role/RoleBinding (cluster-wide access - security-sensitive).
  serviceAccount:
    annotations: {}
    clusterScope: false
## @param supervisor.extraEnv [array] Extra environment variables for the supervisor container.
  extraEnv: []

## @section Supervisor configuration

## @param supervisor.config.server.dataHostname Data-plane hostname for engine fleets.
## @param supervisor.config.server.publicUrl Public URL of the supervisor.
  config:
    server:
      dataHostname: "data.supv.example.com"
      publicUrl: "https://supv.example.com"
## @param supervisor.config.database.dir Raft data directory (raft.db, snapshots/, node-id). Fresh-start store; no migration from legacy SQLite.
    database:
      dir: "/var/lib/dagger-cache"
## @param supervisor.config.raft.nodeId Raft node ID ("" = derive from the StatefulSet pod name).
## @param supervisor.config.raft.bindAddr Dedicated Raft transport bind address.
## @param supervisor.config.raft.advertiseAddr Routable advertise host:port ("" = derive from <hostname>.<headless_service>.<namespace>.svc.<cluster_domain>).
## @param supervisor.config.raft.peers [array] Explicit Raft voter override (empty = DNS discovery from the StatefulSet). Each entry is {id, address}.
## @param supervisor.config.raft.replicas Voter count for DNS peer discovery. Keep in sync with supervisor.replicaCount.
## @param supervisor.config.raft.statefulsetName StatefulSet name for DNS discovery ("" = the chart's StatefulSet name).
## @param supervisor.config.raft.headlessService Headless Service name for stable pod DNS ("" = <release>-headless).
## @param supervisor.config.raft.namespace K8s namespace for pod DNS ("" = release namespace).
## @param supervisor.config.raft.clusterDomain K8s cluster DNS suffix.
## @param supervisor.config.raft.applyTimeout Raft apply timeout.
## @param supervisor.config.raft.leaderWaitTimeout Startup wait for Raft leadership.
## @param supervisor.config.raft.snapshotThreshold Raft snapshot log threshold.
## @param supervisor.config.raft.snapshotInterval Raft snapshot interval.
## @param supervisor.config.raft.trailingLogs Raft trailing logs after snapshot.
## @param supervisor.config.raft.tls.enabled Enable mTLS for the Raft transport (recommended for multi-node).
## @param supervisor.config.raft.tls.dir Directory for the internal raft CA + per-pod leaf cert ("" = <database.dir>/tls).
## @param supervisor.config.raft.tls.validity Leaf cert TTL.
## @param supervisor.config.raft.tls.organization Organization in the internal CA/leaf subjects.
## @param supervisor.config.raft.tls.caCert Manual mode: path to a pre-provisioned CA cert PEM.
## @param supervisor.config.raft.tls.cert Manual mode: path to a pre-provisioned leaf cert PEM.
## @param supervisor.config.raft.tls.key Manual mode: path to a pre-provisioned leaf key PEM.
## @param supervisor.config.raft.tls.caSecret K8s Secret name for sharing the internal raft CA ("" = <release>-raft-ca).
##   SECURITY: this Secret holds the raft CA PRIVATE KEY (any pod may issue peer certs) and the
##   <release>-minting-ca Secret holds the engine-client minting CA private key. Both are written
##   by the supervisor ServiceAccount; the RBAC in rbac.yaml already restricts `secrets` to the
##   release namespace, so do NOT broaden it or grant other workloads access to these Secrets.
## @param supervisor.config.raft.tls.caBootstrap Force this node to generate + write the CA Secret (auto-detects ordinal 0 otherwise).
## @param supervisor.config.raft.tls.clientAuth Require and verify peer client certs (mTLS).
    raft:
      nodeId: ""
      bindAddr: ":8081"
      advertiseAddr: ""
      peers: []
      replicas: 3
      statefulsetName: ""
      headlessService: ""
      namespace: ""
      clusterDomain: "cluster.local"
      applyTimeout: "5s"
      leaderWaitTimeout: "30s"
      snapshotThreshold: 1000
      snapshotInterval: "10m"
      trailingLogs: 256
      tls:
        enabled: true
        dir: ""
        validity: "8760h"
        organization: "dagger-cache-raft"
        caCert: ""
        cert: ""
        key: ""
        caSecret: ""
        caBootstrap: false
        clientAuth: true
## @param supervisor.config.auth.internal.enabled Enable internal token authentication.
## @param supervisor.config.auth.internal.tokensFile Path to the static tokens file.
## @param supervisor.config.auth.bootstrapAdmin.username Bootstrap admin username.
## @param supervisor.config.auth.bootstrapAdmin.password Bootstrap admin password (empty = random password logged once at first boot).
## @param supervisor.config.auth.jwt.secret JWT signing secret (empty = auto-generated and persisted in DB).
## @param supervisor.config.auth.jwt.accessTtl JWT access token TTL.
## @param supervisor.config.auth.jwt.refreshTtl JWT refresh token TTL.
## @param supervisor.config.auth.oauth.enabled Enable OAuth2 authentication.
## @param supervisor.config.auth.oauth.provider OAuth2 provider (e.g. github).
## @param supervisor.config.auth.oauth.clientId OAuth2 client ID.
## @param supervisor.config.auth.oauth.clientSecret OAuth2 client secret.
## @param supervisor.config.auth.oauth.redirectUrl OAuth2 redirect URL.
## @param supervisor.config.auth.oauth.allowedOrgs [array] Allowed OAuth organizations.
## @param supervisor.config.auth.oauth.defaultGroup Default group for OAuth users.
    auth:
      internal:
        enabled: true
        tokensFile: "/etc/dagger-cache/tokens"
      bootstrapAdmin:
        username: "admin"
        password: ""
      jwt:
        secret: ""
        accessTtl: "15m"
        refreshTtl: "168h"
      oauth:
        enabled: false
        provider: "github"
        clientId: "${OAUTH_CLIENT_ID}"
        clientSecret: "${OAUTH_CLIENT_SECRET}"
        redirectUrl: "https://supv.example.com/api/v1/auth/oauth/github/callback"
        allowedOrgs: ["acme"]
        defaultGroup: ""
## @param supervisor.config.telemetry.collectorUrl OTel collector URL (auto-wired when otelCollector enabled).
## @param supervisor.config.telemetry.tempoUrl Tempo URL for trace queries.
## @param supervisor.config.telemetry.lokiUrl Loki URL for log queries.
## @param supervisor.config.telemetry.victoriaUrl VictoriaMetrics URL for metric queries.
    telemetry:
      collectorUrl: ""
      tempoUrl: "http://tempo:3200"
      lokiUrl: "http://loki:3100"
      victoriaUrl: "http://victoria:8428"
## @param supervisor.config.cache.backend Cache backend type: registry (OCI) or s3.
## @param supervisor.config.cache.registry Cache registry ref (auto-wired public ref `<cachePublicHost>/dagger-cache`).
## @param supervisor.config.cache.publicHost Dedicated cache vhost engines push/pull through (empty = derived `cache.<server.publicUrl host>`). Must differ from the control-plane host.
## @param supervisor.config.cache.internalAddr Legacy single backend address (empty = auto-wired `<release>-registry:5000` when tools.registry enabled).
## @param supervisor.config.cache.authToken Engine→proxy bearer (empty = read from the engine-registry-auth secret key `token`).
## @param supervisor.config.cache.registries [array] Multi-backend list of {id, internalAddr, username, password} (empty = single-backend mode).
## @param supervisor.config.cache.refPerVersion Enable per-version cache references.
## @param supervisor.config.cache.s3.bucket S3 bucket name (when backend=s3).
## @param supervisor.config.cache.s3.region S3 region (when backend=s3).
    cache:
      backend: "registry"
      registry: ""
      publicHost: ""
      internalAddr: ""
      authToken: ""
      registries: []
      refPerVersion: true
      s3:
        bucket: ""
        region: ""
## @param supervisor.config.fleet.minReplicasPerVersion Minimum warm engine replicas per Dagger version.
## @param supervisor.config.fleet.maxReplicasPerVersion Maximum engine replicas per Dagger version.
## @param supervisor.config.fleet.maxSessionsPerReplica Maximum concurrent sessions per engine replica.
## @param supervisor.config.fleet.replicaIdleTtl Idle TTL before scaling down an engine replica.
## @param supervisor.config.fleet.versionRetention Duration to retain engine versions after last use.
## @param supervisor.config.fleet.engineImageRegistry Engine container image registry.
## @param supervisor.config.fleet.engineStorageClass StorageClass for engine PVCs (empty = cluster default).
## @param supervisor.config.fleet.engineStorageSize PVC size for each engine.
## @param supervisor.config.fleet.engineCPURequest Engine CPU request.
## @param supervisor.config.fleet.engineCPULimit Engine CPU limit.
## @param supervisor.config.fleet.engineMemoryRequest Engine memory request.
## @param supervisor.config.fleet.engineMemoryLimit Engine memory limit.
## @param supervisor.config.fleet.engineTerminationGraceSeconds Engine pod termination grace period.
## @param supervisor.config.fleet.enginePullPolicy Engine image pull policy.
## @param supervisor.config.fleet.enginePrivileged Run engine container in privileged mode.
## @param supervisor.config.fleet.engineNodeSelector [object] Node selector for engine pods.
## @param supervisor.config.fleet.engineTolerations [array] Tolerations for engine pods.
## @param supervisor.config.fleet.engineExtraArgs [array] Additional CLI args passed to the engine.
## @param supervisor.config.fleet.engineExtraEnv [object] Extra env vars on engine pods.
## @param supervisor.config.fleet.engineExtraEnvFrom [object] Extra env vars sourced from Secret keys on engine pods.
## @param supervisor.config.fleet.engineCaSecret Secret with custom CA PEM bundle for engines (empty = disabled).
## @param supervisor.config.fleet.engineCaSecretKey Key inside engineCaSecret containing the CA cert.
## @param supervisor.config.fleet.engineDebug Enable engine.toml [debug].
## @param supervisor.config.fleet.engineLogFormat Engine log format (json, text; empty omits).
## @param supervisor.config.fleet.engineRegistryMirrors [object] Engine registry mirrors (e.g. {"docker.io": ["mirror.gcr.io"]}).
    fleet:
      minReplicasPerVersion: 0
      maxReplicasPerVersion: 3
      maxSessionsPerReplica: 8
      replicaIdleTtl: "5m"
      versionRetention: "24h"
      engineImageRegistry: "registry.dagger.io/engine"
      engineStorageClass: ""
      engineStorageSize: "50Gi"
      engineCPURequest: "500m"
      engineCPULimit: "2000m"
      engineMemoryRequest: "1Gi"
      engineMemoryLimit: "8Gi"
      engineTerminationGraceSeconds: 120
      enginePullPolicy: "IfNotPresent"
      enginePrivileged: true
      engineNodeSelector: {}
      engineTolerations: []
      engineExtraArgs: []
      engineExtraEnv: {}
      engineExtraEnvFrom: {}
      engineCaSecret: ""
      engineCaSecretKey: "ca.crt"
      engineDebug: false
      engineLogFormat: "json"
      engineRegistryMirrors: {}
## @param supervisor.config.ca.clientCertTtl Client certificate TTL.
##   The engine-client minting CA is shared across supervisor pods via the
##   <release>-minting-ca Secret (ca.minting_ca_secret), which holds the CA
##   private key — RBAC-restrict it to the supervisor ServiceAccount.
    ca:
      clientCertTtl: "2h"
## @param supervisor.config.tls.provider TLS provider for the control plane ("embedded" or "cert-manager").
## @param supervisor.config.tls.certPath Control-plane certificate path (empty = TLS disabled).
## @param supervisor.config.tls.keyPath Control-plane key path (empty = TLS disabled).
    tls:
      provider: "embedded"
      certPath: ""
      keyPath: ""
## @param supervisor.config.leaseTtl Engine session lease TTL.
    leaseTtl: "2m"
## @param supervisor.config.version.floor Minimum supported Dagger engine version.
## @param supervisor.config.version.allowlist [array] Allowed Dagger versions (segments).
    version:
      floor: "v0.19.0"
      allowlist: ["0.19", "0.20", "0.21"]
## @param supervisor.config.logLevel Supervisor log level.
    logLevel: "info"
## @param supervisor.config.logFormat Supervisor log format (json, text).
    logFormat: "json"
## @param supervisor.config.otel.otlpEndpoint Supervisor OTLP export endpoint (empty disables).
    otel:
      otlpEndpoint: ""

## @section Authentication

## @param auth.tokens [array] Static bearer tokens (DEPRECATED: legacy fallback, migrate with supervisor migrate-tokens).
## @param auth.adminPassword Bootstrap admin password. When empty, a random password is generated and logged once at first boot.
## @param auth.engineToken Token for engine cache registry auth (engine-registry-auth secret). Empty = "placeholder".
## @param auth.engineDockerConfig Base64-encoded Docker config.json for engine image pulls (private registries).
## @param auth.jwtSecret JWT signing secret (HS256). Empty = auto-generated and persisted in DB.
auth:
  tokens: []
  adminPassword: ""
  engineToken: ""
  engineDockerConfig: ""
  jwtSecret: ""

## @section Minting CA and TLS

## @param ca.crt PEM-encoded CA certificate for engine mTLS.
## @param ca.key PEM-encoded CA private key for engine mTLS.
ca:
  crt: ""
  key: ""
## @param tls.crt PEM-encoded data-plane server certificate.
## @param tls.key PEM-encoded data-plane server private key.
tls:
  crt: ""
  key: ""

## @section Services

## @param service.control.type Control-plane service type.
## @param service.control.port Control-plane service port.
## @param service.control.nodePort Control-plane service node port (when type=NodePort).
service:
  control:
    type: ClusterIP
    port: 80
    nodePort: ""
## @param service.data.type Data-plane service type. ClusterIP when using ingress.
## @param service.data.port Data-plane service port (maps to supervisor :8443).
## @param service.data.nodePort Data-plane node port (when type=NodePort and no ingress).
  data:
    type: ClusterIP
    port: 443
    nodePort: ""

## @section Ingress

## @param ingress.enabled Enable control-plane Ingress (web UI + API).
## @param ingress.className Ingress class name (empty = default ingress controller).
## @param ingress.annotations [object] Ingress annotations.
## @param ingress.hosts [array] Ingress host rules.
## @param ingress.hosts[].host Hostname for the ingress rule.
## @param ingress.hosts[].paths[].path URL path for the ingress rule.
## @param ingress.hosts[].paths[].pathType Path matching type (Prefix, Exact, ImplementationSpecific).
## @param ingress.cacheHost Cache vhost hostname (empty = derived from the cachePublicHost helper). A second host rule + TLS SAN entry is added for it.
## @param ingress.tls [array] Ingress TLS configuration.
ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: supv.example.com
      paths:
        - path: /
          pathType: Prefix
  cacheHost: ""
  tls: []

## @section Data-plane Ingress (mTLS passthrough)

## @param dataIngress.enabled Expose data plane via TLS passthrough on a dedicated host.
##   Creates an ingress with nginx.ingress.kubernetes.io/ssl-passthrough: "true".
##   The data plane cert must include this hostname (embedded provider adds it
##   automatically; for external/cert-manager providers, ensure the cert has it).
## @param dataIngress.host Hostname for the data plane (e.g. data.supv.example.com).
##   Must resolve to the same IP as the control plane ingress.
## @param dataIngress.className Ingress class name.
## @param dataIngress.annotations [object] Additional ingress annotations.
## @param dataIngress.tls.secretName [string] Secret name for the data-plane TLS cert.
##   When set, cert-manager issues a Let's Encrypt certificate from this Ingress
##   (add the annotation `cert-manager.io/cluster-issuer: <issuer>` to dataIngress.annotations).
##   The secret is mounted into the supervisor, which serves it over ssl-passthrough.
##   Takes precedence over dataCert.secretName.
dataIngress:
  enabled: false
  host: "data.supv.example.com"
  className: ""
  annotations: {}
  tls:
    secretName: ""

## @section Data-plane certificate (cert-manager)

## @param dataCert.enabled Provision a Let's Encrypt certificate for the data
##   plane via cert-manager. Requires cert-manager to be installed. The
##   resulting Secret is mounted as the supervisor's TLS server certificate.
##   When enabled, tls.provider must be set to "cert-manager".
## @param dataCert.issuerName cert-manager ClusterIssuer name (e.g. letsencrypt-prod).
## @param dataCert.issuerKind cert-manager issuer kind: ClusterIssuer or Issuer.
## @param dataCert.secretName Secret name where cert-manager stores the certificate.
dataCert:
  enabled: false
  issuerName: "letsencrypt-prod"
  issuerKind: "ClusterIssuer"
  secretName: ""

## @section Prometheus ServiceMonitor

## @param serviceMonitor.enabled Enable Prometheus ServiceMonitor.
## @param serviceMonitor.labels [object] Labels applied to the ServiceMonitor.
## @param serviceMonitor.interval Scrape interval.
## @param serviceMonitor.scrapeTimeout Scrape timeout.
serviceMonitor:
  enabled: false
  labels: {}
  interval: 30s
  scrapeTimeout: 10s

## @section Observability tools

## @param tools.otelCollector.enabled Install OpenTelemetry Collector subchart.
## @param tools.registry.enabled Install Docker Registry subchart (cache backend).
## @param tools.tempo.enabled Install Grafana Tempo subchart (traces).
## @param tools.loki.enabled Install Grafana Loki subchart (logs).
## @param tools.victoria.enabled Install VictoriaMetrics subchart (metrics).
## @param tools.grafana.enabled Install Grafana subchart (dashboards).
tools:
  otelCollector:
    enabled: true
  registry:
    enabled: true
  tempo:
    enabled: true
  loki:
    enabled: true
  victoria:
    enabled: true
  grafana:
    enabled: true

## @section Subchart overrides
## @descriptionStart
## Subchart defaults forwarded to each dependency. All PVC-bearing subcharts
## support storageClassName (empty = cluster default StorageClass).
## @descriptionEnd

## @skip opentelemetry-collector
opentelemetry-collector:
  mode: deployment
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.108.0"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  service:
    type: ClusterIP
  config:
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
      transform/logs:
        log_statements:
          - context: log
            statements:
              - set(attributes["trace_id"], trace_id.string)
              - set(attributes["span_id"], span_id.string)
              - set(attributes["loki.attribute.labels"], "trace_id,span_id")
    exporters:
      otlphttp/tempo:
        endpoint: http://{{ .Release.Name }}-tempo:4318
        tls:
          insecure: true
      loki:
        endpoint: http://{{ .Release.Name }}-loki:3100/loki/api/v1/push
        tls:
          insecure: true
      prometheusremotewrite:
        endpoint: http://{{ .Release.Name }}-victoria-server:8428/prometheus/api/v1/write
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/tempo]
        logs:
          receivers: [otlp]
          processors: [transform/logs, batch]
          exporters: [loki]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheusremotewrite]

## @skip registry
registry:
  replicaCount: 1
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
  storage: filesystem
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

## @skip tempo
tempo:
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""
  tempo:
    retention: 48h
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

## @skip loki
loki:
  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  loki:
    ## @param loki.auth_enabled Enable Loki multi-tenancy/auth. Disabled because
    ## the supervisor and OTel collector talk to Loki without an X-Scope-OrgID.
    auth_enabled: false
    ## @param loki.commonConfig.replication_factor Loki replication factor.
    ## Must be 1 for SingleBinary mode (single replica), otherwise writes fail
    ## with "at least 2 live replicas required".
    commonConfig:
      replication_factor: 1
    useTestSchema: true
    storage:
      bucketNames:
        chunks: chunks
        ruler: ruler

## @skip victoria
victoria:
  server:
    persistentVolume:
      enabled: true
      size: 20Gi
      storageClassName: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

## @skip grafana
grafana:
  adminPassword: ""
  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource
