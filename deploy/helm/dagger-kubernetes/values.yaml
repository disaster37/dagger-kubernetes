# dagger-kubernetes Helm chart values
# ---------------------------------------------------------------------------
# Copy to your own values file and override as needed, e.g.:
#   helm install dagger-kubernetes ./deploy/helm/dagger-kubernetes -f my-values.yaml

## @section Chart metadata

## @param nameOverride [string] Override the chart name used in resource labels.
nameOverride: ""
## @param fullnameOverride [string] Override the full name of the release.
fullnameOverride: ""
## @param namespace [string] Namespace for the supervisor and subchart dependencies. Defaults to the release namespace when empty.
namespace: ""

## @section Cross-subchart service names (collector exporters)

## @descriptionStart
## The OTel collector config is rendered by the opentelemetry-collector
## subchart, whose template scope cannot see the parent's `tempo`/`loki`/
## `victoria` values. To point the collector's exporters at a renamed backend,
## set the matching value here *in addition to* the subchart's own
## `fullnameOverride`. Empty = auto (`<release>-<default-name>`).
## @descriptionEnd

## @param global.daggerKubernetes.serviceNames.tempo Tempo Service name used by the collector's otlphttp/tempo exporter (empty = `<release>-tempo`).
## @param global.daggerKubernetes.serviceNames.loki Loki Service name used by the collector's loki exporter (empty = `<release>-loki`).
## @param global.daggerKubernetes.serviceNames.victoria VictoriaMetrics Service name used by the collector's prometheusremotewrite exporter (empty = `<release>-victoria-server`).
global:
  daggerKubernetes:
    serviceNames:
      tempo: ""
      loki: ""
      victoria: ""

## @section Supervisor (control-plane pod)

## @param supervisor.enabled Enable the supervisor (control plane + data plane) and its resources.
## @param supervisor.image.repository Supervisor container image repository.
## @param supervisor.image.tag Image tag (empty defaults to Chart.appVersion).
## @param supervisor.image.pullPolicy Image pull policy.
## @param supervisor.image.pullSecrets [array] Image pull secrets for private registries.
supervisor:
  enabled: true
  image:
    repository: ghcr.io/disaster37/dagger-kubernetes
    tag: ""
    pullPolicy: IfNotPresent
    pullSecrets: []
## @param supervisor.replicaCount Number of supervisor pods. Single source of truth for the Raft cluster size: each supervisor pod is one Raft voter, so the voter count is derived from this value (never asked separately). Use an odd number >= 3 for quorum fault tolerance (a 2-node cluster has no failure tolerance).
  replicaCount: 3
## @param supervisor.resources.requests.cpu Supervisor CPU request.
## @param supervisor.resources.requests.memory Supervisor memory request.
## @param supervisor.resources.limits.cpu Supervisor CPU limit.
## @param supervisor.resources.limits.memory Supervisor memory limit.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
## @param supervisor.persistence.enabled Enable a per-pod PVC for the Raft data directory (StatefulSet volumeClaimTemplate). disabled = emptyDir (dev only).
## @param supervisor.persistence.storageClass StorageClass for the supervisor PVC (empty = cluster default).
## @param supervisor.persistence.size PVC size for each supervisor pod's Raft data directory.
  persistence:
    enabled: true
    storageClass: ""
    size: 2Gi
## @param supervisor.podAnnotations [object] Annotations added to the supervisor pod.
  podAnnotations: {}
## @param supervisor.podSecurityContext.runAsNonRoot Run supervisor container as non-root.
## @param supervisor.podSecurityContext.runAsUser User ID for the supervisor container.
## @param supervisor.podSecurityContext.runAsGroup Group ID for the supervisor container.
## @param supervisor.podSecurityContext.fsGroup Filesystem group for mounted volumes.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
## @param supervisor.securityContext.allowPrivilegeEscalation Allow privilege escalation.
## @param supervisor.securityContext.readOnlyRootFilesystem Mount root filesystem as read-only.
## @param supervisor.securityContext.capabilities.drop [array] Linux capabilities to drop.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
## @param supervisor.nodeSelector [object] Node selector for supervisor pod scheduling.
  nodeSelector: {}
## @param supervisor.tolerations [array] Tolerations for supervisor pod scheduling.
  tolerations: []
## @param supervisor.affinity [object] Affinity rules for supervisor pod scheduling.
  affinity: {}
## @param supervisor.serviceAccount.annotations [object] Annotations for the supervisor ServiceAccount.
## @param supervisor.serviceAccount.clusterScope Use ClusterRole instead of namespaced Role/RoleBinding (cluster-wide access - security-sensitive).
  serviceAccount:
    annotations: {}
    clusterScope: false
## @param supervisor.extraEnv [array] Extra environment variables for the supervisor container.
  extraEnv: []
  # extraEnvFrom: env vars sourced from K8s Secret/ConfigMap keys injected
  # into the supervisor container. Use to set proxy env vars (HTTP_PROXY,
  # HTTPS_PROXY, NO_PROXY) that the supervisor needs when downloading the
  # Dagger CLI from upstream. Example:
  # extraEnvFrom:
  #   - secretRef:
  #       name: "proxy-settings"
## @param supervisor.extraEnvFrom [array] Extra envFrom sources for the supervisor container (e.g. proxy env vars from a Secret).
  extraEnvFrom: []
## @param supervisor.dns.enabled Bypass NodeLocal DNSCache for the Raft pods (fix #3).
##   When true (default), the StatefulSet renders dnsPolicy: None + dnsConfig pointing
##   directly at the cluster's kube-dns (CoreDNS) service, avoiding the ~30s stale
##   positive-A-record window after a pod is recreated. Set false to restore the
##   cluster's default DNS (NodeLocal DNSCache when installed).
## @param supervisor.dns.nameserver kube-dns (CoreDNS) service ClusterIP. Helm cannot
##   query the cluster, so set this to your cluster's value:
##     kubectl -n kube-system get svc kube-dns -o jsonpath='{.spec.clusterIP}'
##   k3s: 10.43.0.10 (this repo's reference cluster); kubeadm/standard: 10.96.0.10.
## @param supervisor.dns.ndots resolv.conf ndots for the supervisor pod (FQDN Raft peers).
  dns:
    enabled: true
    nameserver: "10.43.0.10"
    ndots: 1

## @section Supervisor data-plane TLS (server certificate)

## @descriptionStart
## Where the supervisor's data-plane server certificate comes from. Three
## cases, all auto-wired by the chart:
## - `embedded` (default): the auto-bootstrapped minting CA issues a
##   self-signed server cert (SANs cover the data host, cache vhost, pod
##   names). Zero config, but NOT publicly trusted — Dagger clients that
##   verify against the system trust pool will fail the handshake.
## - `cert-manager`: set `dataCert.enabled: true` (chart-rendered
##   Certificate) — the chart auto-switches `provider` to "cert-manager" and
##   auto-wires `certPath`/`keyPath` to the mounted data-tls secret.
## - custom secret: set `dataIngress.tls.secretName` (any tls.crt/tls.key
##   Secret — cert-manager via Ingress annotation, or operator-managed) —
##   the chart auto-switches `provider` to "external" and auto-wires
##   `certPath`/`keyPath` to the mounted data-tls secret.
## When BOTH dataCert.enabled and dataIngress.tls.secretName are set,
## dataIngress.tls.secretName wins (that secret is mounted and served;
## cert-manager's dataCert secret is unused). Operators should set only one
## of them. When neither is set, `provider` selects embedded (default),
## cert-manager (operator-managed mounted files), or external (PEM files at
## certPath/keyPath, or crt/key rendered into the <fullname>-tls Secret).
## @descriptionEnd

## @param supervisor.dataplane.tls.provider Server certificate source: "embedded" (default) | "cert-manager" | "external". Auto-overridden to "cert-manager" when dataCert.enabled, and to "external" when dataIngress.tls.secretName is set.
## @param supervisor.dataplane.tls.certPath Server certificate path (only "external", or auto-wired). cert-manager/dataIngress auto-wire the mounted data-tls secret.
## @param supervisor.dataplane.tls.keyPath Server key path (only "external", or auto-wired).
## @param supervisor.dataplane.tls.clientCertTtl Client certificate TTL (engine session certs minted from the CA).
## @param supervisor.dataplane.tls.caCrt [optional] PEM-encoded minting CA certificate. Leave empty to AUTO-BOOTSTRAP on first boot.
## @param supervisor.dataplane.tls.caKey [optional] PEM-encoded minting CA private key. Leave empty to AUTO-BOOTSTRAP on first boot.
##   When both are empty (the default), the supervisor generates the minting CA
##   on first boot and stores it in the <release>-minting-ca Secret. Only set
##   these to bring an existing CA (e.g. migrating from a prior deployment).
## @param supervisor.dataplane.tls.crt [optional] PEM-encoded server certificate (only needed for provider "external").
## @param supervisor.dataplane.tls.key [optional] PEM-encoded server private key (only needed for provider "external").
  dataplane:
    tls:
      provider: "embedded"
      certPath: ""
      keyPath: ""
      clientCertTtl: "2h"
      caCrt: ""
      caKey: ""
      crt: ""
      key: ""

## @section Supervisor configuration

## @descriptionStart
## URLs are NOT asked — they are computed from the exposition:
## - `server.public_url` (UI + API): `https://<ingress host>` when the ingress
##   has TLS, `http://<ingress host>` without TLS; `<service.control.host>`
##   for LoadBalancer/NodePort; else the internal
##   `https://<release>-control.<namespace>.svc:<port>`.
## - `server.data_hostname` (engine data plane): `<dataIngress.host>` when the
##   data ingress is enabled, `<service.data.host>` for LoadBalancer/NodePort,
##   else `<release>-data.<namespace>.svc:<port>`.
## - `server.pipeline_url` is dropped: pipeline-view links use the same URL as
##   the UI.
## Container paths/ports are fixed (control :8080, data :8443, raft :8081,
## data dir /var/lib/dagger-kubernetes); only the Service ports are
## configurable.
## @descriptionEnd

## @param supervisor.config.raft.tls.enabled Enable mTLS for the Raft transport.
## @param supervisor.config.raft.tls.clientAuth Require and verify peer client certs (mTLS).
##   The Raft voter count is NOT asked: it is derived from supervisor.replicaCount.
##   Everything else is derived automatically: node IDs come from the
##   StatefulSet pod names, peer discovery from the headless Service DNS, and
##   the internal CA is auto-bootstrapped in the <release>-raft-ca Secret.
  config:
    raft:
## @param supervisor.config.raft.clusterDomain Cluster DNS suffix appended to peer addresses (`<pod>.<headless>.<ns>.svc.<clusterDomain>`). Default `"cluster.local"` produces fully-qualified names that bypass CoreDNS negative-cache poisoning (short `.svc` names go through the cache plugin which can serve stale NXDOMAIN for up to 30 s during bootstrap). Set to `""` only when your cluster DNS does not serve the `cluster.local` suffix.
      clusterDomain: "cluster.local"
      tls:
        enabled: true
        clientAuth: true
## @param supervisor.config.raft.tls.rotationPeriod How often to rotate TLS certificates. Default: 24h.
        rotationPeriod: "24h"
## @param supervisor.config.raft.tls.caValidity CA certificate validity period. Default: 262800h (30 years).
        caValidity: "262800h"
## @param supervisor.config.raft.performanceMultiplier Scales election/heartbeat/lease timeouts. Higher values reduce false-positive leader elections at the cost of slower failure detection. Default: 5.0.
      performanceMultiplier: 5.0
## @param supervisor.config.raft.raftLogCacheSize In-memory Raft log cache size. Default: 512.
      raftLogCacheSize: 512
## @param supervisor.config.raft.noSnapshotRestoreOnStart Disable automatic snapshot restore on start. When true, the FSM replays only the Raft log on restart, which silently loses all snapshotted data after log compaction. Set to true only when snapshots are managed externally. Default: false.
      noSnapshotRestoreOnStart: false
## @param supervisor.config.raft.terminationGracePeriodSeconds Pod termination grace period. Default: 60.
      terminationGracePeriodSeconds: 60
## @param supervisor.config.raft.recoveryMode Clear stale raft state (raft.db, snapshots, node-id) on startup and bootstrap a fresh cluster. Manual quorum-loss recovery only. Default: false.
      recoveryMode: false
## @param supervisor.config.raft.transportMaxPool Raft transport connection pool size per peer. Default: 1.
##   In Kubernetes StatefulSet environments where pod IPs change across
##   restarts, a small pool forces fresh DNS resolution on each connection,
##   reducing the window where stale cached connections point to old pod IPs
##   (Cilium eBPF DNS proxy delays, ADR-029 DNS bypass caveats).
      transportMaxPool: 1
## @param supervisor.config.raft.autopilot.enabled Enable autopilot subsystem.
## @param supervisor.config.raft.autopilot.cleanupDeadServers Auto-remove dead servers.
## @param supervisor.config.raft.autopilot.deadServerLastContactThreshold Time before server considered dead.
## @param supervisor.config.raft.autopilot.minQuorum Minimum voters before stopping removal. Default: 2 (for 3-node clusters, one failure tolerated).
## @param supervisor.config.raft.autopilot.stabilizationTime Wait time between membership changes. Default: 10s.
## @param supervisor.config.raft.autopilot.heartbeatInterval Leader heartbeat check interval. Default: 1s.
      autopilot:
        enabled: true
        cleanupDeadServers: true
        deadServerLastContactThreshold: "24h"
        minQuorum: 2
        stabilizationTime: "10s"
        heartbeatInterval: "1s"
## @param supervisor.config.raft.join.retryInterval Interval between join attempts. Default: 2s.
## @param supervisor.config.raft.join.maxConcurrent Max concurrent join workers. Default: 20.
      join:
        retryInterval: "2s"
        maxConcurrent: 20
## @param supervisor.config.telemetry.collectorUrl OTel collector URL (auto-wired to `<release>-opentelemetry-collector.<namespace>.svc:4318` when the opentelemetry-collector subchart is enabled; the Service name follows the subchart's own fullname rules and honors its `fullnameOverride`/`nameOverride`).
## @param supervisor.config.telemetry.tempoUrl Tempo URL for trace queries (auto-wired to `<release>-tempo.<namespace>.svc:3200` when the tempo subchart is enabled; the Service name follows the subchart's own fullname rules and honors its `fullnameOverride`/`nameOverride`).
## @param supervisor.config.telemetry.lokiUrl Loki URL for log queries (auto-wired to `<release>-loki.<namespace>.svc:3100` when the loki subchart is enabled; the Service name follows the subchart's own fullname rules and honors its `fullnameOverride`/`nameOverride`).
## @param supervisor.config.telemetry.victoriaUrl VictoriaMetrics URL for metric queries (auto-wired to `<release>-victoria-server.<namespace>.svc:8428` when the victoria subchart is enabled; the Service name follows the subchart's own fullname rules and honors its `server.fullnameOverride`).
## In-cluster endpoints must use the `<service>.<namespace>.svc` form — never bare service names or `.svc.<cluster-domain>` FQDNs — so a single `.svc` NO_PROXY entry covers every in-cluster component when HTTP_PROXY is set (see CONTRIBUTING.md).
    telemetry:
      collectorUrl: ""
      tempoUrl: ""
      lokiUrl: ""
      victoriaUrl: ""
## @param supervisor.config.cache.s3.bucket S3 bucket name. Defaults to the auto-created minio bucket when the minio subchart is enabled.
## @param supervisor.config.cache.s3.region S3 region (ignored by MinIO).
## @param supervisor.config.cache.s3.endpoint S3-compatible endpoint for the shared S3 client (CLI cache). Auto-wired to `<release>-minio.<namespace>.svc:9000` when the minio subchart is enabled; the Service name follows the subchart's own fullname rules and honors its `fullnameOverride`/`nameOverride`.
## @param supervisor.config.cache.s3.useSSL Use HTTPS for the S3 endpoint.
## @param supervisor.config.cache.s3.accessKey S3 access key. Leave empty in values: the supervisor reads it from the `engine-s3-auth` Secret via DAGGER_KUBERNETES_CACHE_S3_ACCESS_KEY (empty falls back to the AWS env credential chain).
## @param supervisor.config.cache.s3.secretKey S3 secret key. Leave empty in values: the supervisor reads it from the `engine-s3-auth` Secret via DAGGER_KUBERNETES_CACHE_S3_SECRET_KEY.
##   The `engine-s3-auth` Secret (keys `accessKey`/`secretKey`) is rendered
##   from the MinIO root credentials when minio.enabled; with an external S3
##   provider create it before enabling the backend:
##     kubectl -n <namespace> create secret generic engine-s3-auth \
##       --from-literal=accessKey=... --from-literal=secretKey=...
    cache:
      s3:
        bucket: ""
        region: "us-east-1"
        endpoint: ""
        useSSL: false
        accessKey: ""
        secretKey: ""
## @param supervisor.config.history.gc.enabled Master switch for the history auto-purge sweeper.
## @param supervisor.config.history.gc.maxAge Purge traces older than this (30d default). Duration strings accept Go units plus "d" (day) and "w" (week), e.g. "7d", "1w".
## @param supervisor.config.history.gc.schedule History sweeper ticker interval.
    history:
      gc:
        enabled: false
        maxAge: "720h"
        schedule: "1h"
## @param supervisor.config.fleet.maxReplicasPerVersion Maximum engine replicas per Dagger version.
## @param supervisor.config.fleet.maxSessionsPerReplica Maximum concurrent sessions per engine replica.
## @param supervisor.config.fleet.replicaIdleTtl Idle TTL before scaling down an engine replica.
## @param supervisor.config.fleet.versionRetention Idle version GC: delete a version's StatefulSet + Service after this long with zero replicas and no pinned sessions (<= 0 disables; positive values < 1m rejected).
## @param supervisor.config.fleet.engineImageRegistry Engine container image registry.
## @param supervisor.config.fleet.engineStorageClass StorageClass for engine PVCs (empty = cluster default).
## @param supervisor.config.fleet.engineStorageSize PVC size for each engine.
## @param supervisor.config.fleet.enginePvcLabels [object] Extra labels added to engine PVCs (merged with managed labels app/version, which take precedence). Keys may contain dots (e.g. `recurring-job-group.longhorn.io/nobackup`) and are preserved verbatim.
## @param supervisor.config.fleet.engineCPURequest Engine CPU request.
## @param supervisor.config.fleet.engineCPULimit Engine CPU limit.
## @param supervisor.config.fleet.engineMemoryRequest Engine memory request.
## @param supervisor.config.fleet.engineMemoryLimit Engine memory limit.
## @param supervisor.config.fleet.engineTerminationGraceSeconds Engine pod termination grace period.
## @param supervisor.config.fleet.enginePullPolicy Engine image pull policy.
## @param supervisor.config.fleet.enginePrivileged Run engine container in privileged mode.
##   Required by BuildKit/Dagger engine for mount/overlay operations that need
##   full root capabilities (rootless mode is not supported by the Dagger
##   engine in this configuration). Do not disable unless you have verified
##   your engine version runs unprivileged.
## @param supervisor.config.fleet.engineNodeSelector [object] Node selector for engine pods.
## @param supervisor.config.fleet.engineTolerations [array] Tolerations for engine pods.
## @param supervisor.config.fleet.engineExtraArgs [array] Additional CLI args passed to the engine.
## @param supervisor.config.fleet.engineExtraEnv [object] Extra env vars on engine pods.
## @param supervisor.config.fleet.engineExtraEnvFrom [object] Extra env vars sourced from Secret keys on engine pods: map of env name -> {secretName, key} (camelCase keys, rendered verbatim into the app config).
## @param supervisor.config.fleet.engineCaSecret Secret with custom CA PEM bundle. When set, the CA is mounted as a directory into /usr/local/share/ca-certificates on both engine and supervisor pods. Dagger auto-detects and installs CAs from this directory on startup. Empty = disabled.
## @param supervisor.config.fleet.engineCaSecretKey Key inside engineCaSecret containing the CA cert.
## @param supervisor.config.fleet.engineDockerConfig Base64-encoded Docker config.json
##   (auths for private registries) used by engine image pulls. Stored verbatim
##   in the `engine-image-auth` Secret `data` key `.dockerconfigjson`
##   (already base64 — do NOT pre-decode): Kubernetes base64-decodes it exactly
##   once on mount, so engine pods read raw JSON at
##   `/etc/dagger/.dockerconfigjson`. Empty = `e30K` (base64 of `{}`). This is
##   NOT an imagePullSecret: the supervisor never attaches it to the engine
##   StatefulSet's `imagePullSecrets`; it is provided as a Docker config file
##   for the engine's own registry authentication.
## @param supervisor.config.fleet.engineDebug Enable engine.toml [debug].
## @param supervisor.config.fleet.engineLogFormat Engine log format (json, text; empty omits).
## @param supervisor.config.fleet.engineRegistryMirrors [object] Engine registry mirrors (e.g. {"docker.io": ["mirror.gcr.io"]}). When imageCache.enabled, the generated in-cluster mirror addresses are merged into this map.
    fleet:
      maxReplicasPerVersion: 3
      maxSessionsPerReplica: 8
      replicaIdleTtl: "5m"
      versionRetention: "24h"
      engineImageRegistry: "registry.dagger.io/engine"
      engineStorageClass: ""
      engineStorageSize: "50Gi"
      enginePvcLabels: {}
      engineCPURequest: "500m"
      engineCPULimit: "2000m"
      engineMemoryRequest: "1Gi"
      engineMemoryLimit: "8Gi"
      engineTerminationGraceSeconds: 120
      enginePullPolicy: "IfNotPresent"
      enginePrivileged: true
      engineNodeSelector: {}
      engineTolerations: []
      engineExtraArgs: []
      # engineExtraEnv: extra env vars for engine pods, e.g. proxy settings:
      # engineExtraEnv:
      #   HTTP_PROXY: "http://proxy.corp.example:3128"
      #   HTTPS_PROXY: "http://proxy.corp.example:3128"
      #   NO_PROXY: "localhost,127.0.0.1,.svc,.cluster.local"
      engineExtraEnv: {}
      # engineExtraEnvFrom: env vars sourced from K8s Secret keys
      # (map: env name -> {secretName, key}; rendered verbatim into the app
      # config). Use for credentials that must never appear in plaintext
      # config, e.g. an authenticated proxy:
      # engineExtraEnvFrom:
      #   HTTP_PROXY:
      #     secretName: "proxy-credentials"
      #     key: "http_proxy"            # secret value: "http://user:pass@proxy.corp.example:3128"
      #   HTTPS_PROXY:
      #     secretName: "proxy-credentials"
      #     key: "https_proxy"
      engineExtraEnvFrom: {}
      engineCaSecret: ""
      engineCaSecretKey: "ca.crt"
      engineDockerConfig: ""
      engineDebug: false
      engineLogFormat: "json"
      # engineRegistryMirrors: engine.toml registry mirrors (quote registry
      # names containing dots, or YAML nests them; the supervisor preserves
      # dotted keys such as "docker.io", "ghcr.io", "public.ecr.aws" verbatim).
      # When imageCache.enabled, the generated in-cluster mirror addresses are
      # merged into this map automatically:
      # engineRegistryMirrors:
      #   "docker.io": ["mirror.gcr.io", "my-mirror.corp.example"]
      engineRegistryMirrors: {}
## @param supervisor.config.leaseTtl Engine session lease TTL.
    leaseTtl: "2m"
## @param supervisor.config.version.floor Minimum supported Dagger engine version.
## @param supervisor.config.version.allowlist [array] Allowed Dagger versions (major.minor prefixes; empty = admit all versions >= floor).
    version:
      floor: "v0.19.0"
      allowlist: ["0.19", "0.20", "0.21"]
## @param supervisor.config.cli.enabled Enable on-the-fly Dagger CLI provisioning addon.
## @param supervisor.config.cli.releaseListTtl Upstream release-list cache TTL.
## @param supervisor.config.cli.downloadTimeout Outbound upstream fetch timeout.
## @param supervisor.config.cli.s3Bucket S3 bucket for CLI tarballs (empty = cache.s3.bucket).
## @param supervisor.config.cli.s3Prefix S3 key prefix for CLI tarballs.
## @param supervisor.config.cli.upstream.releasesUrl Release discovery URL (mirror-able).
## @param supervisor.config.cli.upstream.downloadBase Tarball + checksums.txt base URL (mirror-able).
## @param supervisor.config.cli.upstream.githubToken Optional GitHub token for the releases API.
    cli:
      enabled: true
      releaseListTtl: "1h"
      downloadTimeout: "5m"
      s3Bucket: ""
      s3Prefix: "cli-cache"
      upstream:
        releasesUrl: "https://api.github.com/repos/dagger/dagger/releases"
        downloadBase: "https://github.com/dagger/dagger/releases/download"
        githubToken: ""
## @param supervisor.config.attribution.projectMappings [array] Ordered list of {pattern, group} mapping a project name (CI repo slug; Go regexp, case-sensitive) to a supervisor group name. First-match-wins; no match falls through to per-group auto_assign_pattern; empty = disabled. Target groups must already exist.
    attribution:
      projectMappings: []
      # projectMappings example (regex → supervisor group name):
      # projectMappings:
      #   - pattern: '^github\.com/acme/.*'
      #     group: 'acme'
## @param supervisor.config.logLevel Supervisor log level.
    logLevel: "info"
## @param supervisor.config.logFormat Supervisor log format (json, text).
    logFormat: "json"
## @param supervisor.config.otel.otlpEndpoint Supervisor OTLP export endpoint (empty disables).
## @param supervisor.config.otel.ingestMaxBodySize OTLP ingest request-body cap in bytes (0 = supervisor default 64 MiB). Keep the ingress `proxyBodySize` and the collector `max_request_body_size` at least this large.
    otel:
      otlpEndpoint: ""
      ingestMaxBodySize: 67108864
## @param supervisor.config.pipeline.metrics.enabled Enable the trace-scoped engine resource metrics endpoint (GET /api/v1/traces/:id/metrics).
## @param supervisor.config.pipeline.metrics.step query_range resolution for engine metrics (Go duration; must be > 0 when enabled).
    pipeline:
      metrics:
        enabled: true
        step: "15s"

## @section Local image cache (Zot mirror)

## @descriptionStart
## A Zot OCI registry per upstream, acting as an on-demand pull-through cache.
## When enabled, the chart renders one Deployment + `<name>-zot-config`
## ConfigMap + Service per enabled preset / custom registry and merges the
## generated mirror addresses into the engine's `engine.toml` registry mirrors
## (with `http = true`, since the in-cluster mirrors are plaintext HTTP).
## Zot's `extensions.sync` fetches an image from upstream on first request and
## serves cached content afterwards; invalidate with the admin image-cache
## prune (no TTL). Zot's online GC reclaims unreferenced blob bytes after
## `imageCache.gc.delay` on the next `imageCache.gc.interval`.
## @descriptionEnd

## @param imageCache.enabled Enable the local image cache (Zot mirrors).
## @param imageCache.image.repository Zot image repository.
## @param imageCache.image.tag Zot image tag (pinned; v2.x serves the OCI Distribution v2 API + online GC).
## @param imageCache.image.pullPolicy Image pull policy.
## @param imageCache.logLevel Zot log level (config.json `log.level`).
## @param imageCache.storage.backend Mirror storage backend: "s3" (shared MinIO) or "pvc" (per-mirror PVC).
## @param imageCache.storage.s3.bucket S3 bucket for cached blobs (auto-created when minio.enabled).
## @param imageCache.storage.s3.region S3 region (ignored by MinIO).
## @param imageCache.storage.s3.endpoint S3 endpoint; auto-wired to `<release>-minio.<namespace>.svc:9000` when minio.enabled (the Service name follows the subchart's own fullname rules and honors its `fullnameOverride`/`nameOverride`).
## @param imageCache.storage.s3.forcePathStyle Use path-style S3 addressing (required by MinIO).
## @param imageCache.storage.s3.secure Use HTTPS for the S3 endpoint.
## @param imageCache.storage.pvc.storageClass StorageClass for per-mirror PVCs (empty = cluster default).
## @param imageCache.storage.pvc.size PVC size per mirror.
## @param imageCache.gc.enabled Enable Zot online garbage collection (storage.gc).
## @param imageCache.gc.delay Minimum age of an unreferenced blob before Zot GC reclaims it (storage.gcDelay).
## @param imageCache.gc.interval How often Zot runs GC (storage.gcInterval).
## @param imageCache.gc.timeWindow Optional daily off-peak GC window "HH:MM-HH:MM" (storage.gcTimeWindow; empty = unrestricted).
## @param imageCache.dedupe Deduplicate identical blobs across manifests (storage.dedupe). Default false: Zot rejects dedupe with the S3 driver ("no remote database configured") unless a remote cache/DB (e.g. Redis) is configured, which this chart does not render. Enable it only with a dedupe-capable backend (documented follow-up).
## @param imageCache.sync.onDemand Fetch an upstream image on first request (extensions.sync.registry.onDemand).
## @param imageCache.sync.preserveDigest Keep upstream manifest digests (extensions.sync.registry.preserveDigest).
## @param imageCache.sync.tlsVerify Verify upstream TLS certificates.
## @param imageCache.sync.downloadDir Local scratch directory for sync downloads (extensions.sync.downloadDir). Required by Zot whenever sync is enabled with S3 storage. Must live under the mounted data volume (/var/lib/registry, an emptyDir for the s3 backend or the PVC for the pvc backend) so it stays writable; changing it elsewhere requires an extra volume/mount.
## @param imageCache.sync.pollInterval Periodic upstream refresh interval (empty = on-demand only; do not use for Docker Hub).
## @param imageCache.sync.maxRetries Upstream fetch retry count.
## @param imageCache.sync.retryDelay Delay between upstream fetch retries.
## @param imageCache.resources.requests.cpu Mirror CPU request.
## @param imageCache.resources.requests.memory Mirror memory request.
## @param imageCache.resources.limits.cpu Mirror CPU limit.
## @param imageCache.resources.limits.memory Mirror memory limit.
## @param imageCache.nodeSelector [object] Node selector for mirror pods.
## @param imageCache.tolerations [array] Tolerations for mirror pods.
## @param imageCache.securityContext [object] Pod securityContext for mirror pods (runAsNonRoot/runAsUser/fsGroup).
## @param imageCache.presets [object] Built-in public upstream presets (docker.io, ghcr.io, public.ecr.aws, quay.io, gcr.io, registry.dagger.io). Each entry: {enabled, username, passwordSecretRef}.
## @param imageCache.registries [array] Extra/custom upstreams (private ECR/GAR/Harbor/…): {host, remoteUrl, username, passwordSecretRef}. Private credentials are a documented follow-up (Zot credentialsFile).
imageCache:
  enabled: false
  image:
    repository: "ghcr.io/project-zot/zot"
    tag: "v2.1.21"
    pullPolicy: IfNotPresent
  logLevel: "warn"
  storage:
    backend: "s3"
    s3:
      bucket: "image-cache"
      region: "us-east-1"
      endpoint: ""
      forcePathStyle: true
      secure: false
    pvc:
      storageClass: ""
      size: "20Gi"
  gc:
    enabled: true
    delay: "2h"
    interval: "1h"
    timeWindow: ""
  dedupe: false
  sync:
    onDemand: true
    preserveDigest: true
    tlsVerify: true
    downloadDir: "/var/lib/registry/sync"
    pollInterval: ""
    maxRetries: 3
    retryDelay: "15m"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  nodeSelector: {}
  tolerations: []
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    fsGroup: 65532
  presets:
    docker.io:
      enabled: true
      username: ""
      passwordSecretRef:
        name: ""
        key: ""
    ghcr.io:
      enabled: true
      username: ""
      passwordSecretRef:
        name: ""
        key: ""
    public.ecr.aws:
      enabled: true
      username: ""
      passwordSecretRef:
        name: ""
        key: ""
    quay.io:
      enabled: true
      username: ""
      passwordSecretRef:
        name: ""
        key: ""
    gcr.io:
      enabled: false
      username: ""
      passwordSecretRef:
        name: ""
        key: ""
    registry.dagger.io:
      enabled: false
      username: ""
      passwordSecretRef:
        name: ""
        key: ""
  registries: []
    # - host: "123456789012.dkr.ecr.us-east-1.amazonaws.com"
    #   remoteUrl: "https://123456789012.dkr.ecr.us-east-1.amazonaws.com"
    #   username: "AWS"
    #   passwordSecretRef: { name: "ecr-creds", key: "password" }

## @section Authentication

## @param auth.bootstrapAdmin.username Bootstrap admin username.
## @param auth.bootstrapAdmin.password Bootstrap admin password. When empty, a random password is generated and logged once at first boot. Ignored when auth.bootstrapAdmin.secretRef.name is set.
## @param auth.bootstrapAdmin.secretRef.name [optional] K8s Secret name holding the bootstrap admin password (takes precedence over auth.bootstrapAdmin.password; the chart-managed <release>-admin-password Secret is not rendered).
## @param auth.bootstrapAdmin.secretRef.key Key inside the Secret holding the password (empty = "password").
## @param auth.jwt.secret JWT signing secret (HS256). Empty = auto-generated and persisted in DB. Ignored when auth.jwt.secretRef.name is set.
## @param auth.jwt.secretRef.name [optional] K8s Secret name holding the JWT secret (takes precedence over auth.jwt.secret; the chart-managed <release>-jwt Secret is not rendered).
## @param auth.jwt.secretRef.key Key inside the Secret holding the JWT secret (empty = "secret").
## @param auth.jwt.accessTtl JWT access token TTL.
## @param auth.jwt.refreshTtl JWT refresh token TTL. Duration strings accept Go units plus "d" (day) and "w" (week), e.g. "7d".
## @param auth.oauth.enabled Enable OAuth2 authentication.
## @param auth.oauth.provider OAuth2 provider: "github" or "oidc" (generic OIDC: Dex, Keycloak, Google, Auth0, ...).
## @param auth.oauth.clientId OAuth2 client ID.
## @param auth.oauth.clientSecret OAuth2 client secret (rendered into the <release>-oauth Secret; injected as DAGGER_KUBERNETES_AUTH_OAUTH_CLIENT_SECRET). Ignored when auth.oauth.clientSecretRef.name is set.
## @param auth.oauth.clientSecretRef.name [optional] K8s Secret name holding the OAuth2 client secret (takes precedence over auth.oauth.clientSecret; the chart-managed <release>-oauth Secret is not rendered).
## @param auth.oauth.clientSecretRef.key Key inside the Secret holding the client secret (empty = "client_secret").
## @param auth.oauth.redirectUrl OAuth2 redirect URL (empty = computed `<publicUrl>/api/v1/auth/oauth/<provider>/callback`).
## @param auth.oauth.allowedOrgs [array] Allowed OAuth organizations (github: org membership; oidc: deprecated alias for allowedGroups).
## @param auth.oauth.allowedTeams [array] (github) Allowed "org/team" slugs; when set with allowedOrgs, both must be satisfied.
## @param auth.oauth.allowedGroups [array] (oidc) Allowed provider group names (groups-claim allowlist; union with allowedOrgs).
## @param auth.oauth.groupMappings [array] Regex group mapping: list of {pattern, replacement} mapping provider groups to supervisor group names (first-match-wins; no match drops the group).
## @param auth.oauth.defaultGroup Default group for OAuth users.
## @param auth.oauth.cookieSecure Force the Secure flag on the oauth_state cookie (set true when TLS terminates in front of the supervisor).
## @param auth.oauth.issuerUrl (oidc) OIDC issuer URL (e.g. https://dex.example.com).
## @param auth.oauth.scopes [array] (oidc) OIDC scopes. Default requests "groups" (groups claim) and "offline_access" (refresh token for IdP revalidation); "openid" and "offline_access" are auto-appended when omitted.
## @param auth.oauth.usernameClaim (oidc) OIDC username claim (fallback: email).
## @param auth.oauth.groupsClaim (oidc) OIDC groups claim (array or single string).
## @param auth.cookie.accessName Access-JWT session cookie name (httpOnly).
## @param auth.cookie.refreshName Refresh-JWT session cookie name (httpOnly).
## @param auth.cookie.secure Force the Secure flag on session cookies.
## @param auth.cors.allowedOrigins [array] Exact-match Origin allowlist.
auth:
  bootstrapAdmin:
    username: "admin"
    password: ""
    secretRef:
      name: ""
      key: "password"
  jwt:
    secret: ""
    secretRef:
      name: ""
      key: "secret"
    accessTtl: "15m"
    refreshTtl: "168h"
  oauth:
    enabled: false
    provider: "github"
    clientId: ""
    clientSecret: ""
    clientSecretRef:
      name: ""
      key: "client_secret"
    redirectUrl: ""
    allowedOrgs: []
    # allowedOrgs example (GitHub org membership):
    # allowedOrgs: ["acme"]
    allowedTeams: []
    # allowedTeams example (GitHub team restriction, "org/team"):
    # allowedTeams: ["acme/eng"]
    allowedGroups: []
    # allowedGroups example (OIDC groups-claim allowlist):
    # allowedGroups: ["devs", "platform"]
    groupMappings: []
    # groupMappings example (regex → supervisor group name):
    # groupMappings:
    #   - pattern: '^github\.com/acme-(.*)$'
    #     replacement: 'acme-$1'
    #   - pattern: '^ldap/(.+)$'
    #     replacement: '$1'
    defaultGroup: ""
    ## @param auth.oauth.mappedGroupMaxRunnerSessions Default max_runner_sessions (concurrent engine sessions; 0 = unlimited) applied to supervisor groups auto-created by groupMappings. Applied only at creation time; never overwrites an existing group's quota.
    mappedGroupMaxRunnerSessions: 0
    ## @param auth.oauth.adminGroups Upstream IdP group names that grant RoleAdmin on login/revalidation (exact, case-sensitive). Empty = disabled.
    adminGroups: []
    # adminGroups example (OIDC groups that auto-promote to admin):
    # adminGroups: ["HM_ADM_ETL_Outils", "platform-admins"]
    cookieSecure: false
    issuerUrl: ""
    scopes: ["openid", "profile", "email", "groups", "offline_access"]
    usernameClaim: "preferred_username"
    groupsClaim: "groups"
    ## @param auth.oauth.revalidateInterval IdP revalidation cache TTL (Go duration). Default 5m.
    revalidateInterval: "5m"
    ## @param auth.oauth.revalidateGrace Serve last-known-good membership for this long when the IdP is
    ##   unreachable or the OIDC credential is unusable. Default 1h.
    revalidateGrace: "1h"
    ## @param auth.oauth.revalidateFailOpen After grace: false = deny (fail-closed), true = allow (fail-open).
    revalidateFailOpen: false
    ## @param auth.oauth.sessionMaxAge Hard bound on an OAuth session (refresh-token age); 0 = disabled.
    sessionMaxAge: "0"
  cookie:
    accessName: "dagger_kubernetes_access"
    refreshName: "dagger_kubernetes_refresh"
    secure: false
  cors:
    allowedOrigins: []

# ---- GitHub OAuth example ---------------------------------------------
# auth:
#   oauth:
#     enabled: true
#     provider: "github"
#     clientId: "Ov23li...github-app-client-id"
#     clientSecretRef: { name: "github-oauth", key: "client_secret" }
#     redirectUrl: "https://supv.example.com/api/v1/auth/oauth/github/callback"
#     allowedOrgs: ["acme"]          # optional org restriction
#     allowedTeams: ["acme/eng"]     # optional team restriction (AND-ed with orgs)
#     groupMappings:
#       - pattern: '^acme$'
#         replacement: 'acme-all'
#     mappedGroupMaxRunnerSessions: 4   # optional: cap auto-created mapped groups
#
# ---- Generic OIDC example (Dex) ---------------------------------------
# auth:
#   internal:
#     enabled: false                  # OIDC-only login
#   oauth:
#     enabled: true
#     provider: "oidc"
#     issuerUrl: "https://dex.example.com"
#     clientId: "dagger-kubernetes"
#     clientSecretRef: { name: "dex-oauth", key: "client_secret" }
#     redirectUrl: "https://supv.example.com/api/v1/auth/oauth/oidc/callback"
#     scopes: ["openid", "profile", "email", "groups", "offline_access"]
#     usernameClaim: "preferred_username"
#     groupsClaim: "groups"
#     allowedGroups: ["devs"]         # optional allowlist
#     groupMappings:
#       - pattern: '^dex:dev-(.*)$'
#         replacement: 'dev-$1'
#     mappedGroupMaxRunnerSessions: 4   # optional: cap auto-created mapped groups

## @section TLS and certificates

## The server-certificate and minting-CA values live under
## `supervisor.dataplane.tls` (see "Supervisor data-plane TLS" above). The
## old top-level `tls:` block was removed — move any of its keys to
## `supervisor.dataplane.tls.*`.

## @section Services

## @param service.control.type Control-plane service type.
## @param service.control.port Control-plane service port (maps to the fixed supervisor :8080).
## @param service.control.nodePort Control-plane service node port (when type=NodePort).
## @param service.control.host Routable hostname/IP for the control plane when exposed via LoadBalancer/NodePort (required then; unused with ingress or ClusterIP).
service:
  control:
    type: ClusterIP
    port: 80
    nodePort: ""
    host: ""
## @param service.data.type Data-plane service type. ClusterIP when using ingress.
## @param service.data.port Data-plane service port (maps to the fixed supervisor :8443).
## @param service.data.nodePort Data-plane node port (when type=NodePort and no ingress; required then, auto-assigned ports are unknown to the chart).
## @param service.data.host Routable hostname/IP for the data plane when exposed via LoadBalancer/NodePort (required then; unused with dataIngress or ClusterIP).
  data:
    type: ClusterIP
    port: 443
    nodePort: ""
    host: ""

## @section Ingress

## @param ingress.enabled Enable control-plane Ingress (web UI + API).
## @param ingress.className Ingress class name (empty = default ingress controller).
## @param ingress.annotations [object] Ingress annotations.
## @param ingress.proxyBodySize nginx `proxy-body-size` annotation value. Must be >= the supervisor's `otel.ingestMaxBodySize` so large OTLP log batches are not rejected with 413 at the ingress.
## @param ingress.hosts [array] Ingress host rules.
## @param ingress.hosts[].host Hostname for the ingress rule.
## @param ingress.hosts[].paths[].path URL path for the ingress rule.
## @param ingress.hosts[].paths[].pathType Path matching type (Prefix, Exact, ImplementationSpecific).
## @param ingress.tls [array] Ingress TLS configuration.
ingress:
  enabled: true
  className: ""
  proxyBodySize: "64m"
  annotations: {}
  hosts:
    - host: supv.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

## @section Data-plane Ingress (mTLS passthrough)

## @param dataIngress.enabled Expose data plane via TLS passthrough on a dedicated host.
##   Creates an ingress with nginx.ingress.kubernetes.io/ssl-passthrough: "true".
##   The data plane cert must include this hostname (embedded provider adds it
##   automatically; for external/cert-manager providers, ensure the cert has it).
## @param dataIngress.host Hostname for the data plane (e.g. data.supv.example.com).
##   Must resolve to the same IP as the control plane ingress.
## @param dataIngress.className Ingress class name.
## @param dataIngress.annotations [object] Additional ingress annotations.
## @param dataIngress.tls.secretName [string] Secret name for the data-plane TLS cert.
##   When set, the chart auto-switches `supervisor.dataplane.tls.provider` to
##   "external" and auto-wires certPath/keyPath to this Secret, mounted at
##   /etc/dagger-kubernetes/data-tls and served by the supervisor over
##   ssl-passthrough (the client must trust it — e.g. a cert-manager Let's
##   Encrypt certificate via the annotation
##   `cert-manager.io/cluster-issuer: <issuer>`, or an operator-managed
##   keypair). Takes precedence over dataCert.secretName.
dataIngress:
  enabled: false
  host: "data.supv.example.com"
  className: ""
  annotations: {}
  tls:
    secretName: ""

## @section Data-plane certificate (cert-manager)

## @param dataCert.enabled Provision a certificate for the data plane via
##   cert-manager (e.g. Let's Encrypt). Requires cert-manager to be installed
##   in the cluster. When enabled, the chart auto-switches
##   `supervisor.dataplane.tls.provider` to "cert-manager" and auto-wires
##   certPath/keyPath to the resulting Secret (mounted as the supervisor's
##   server certificate). The minting CA is still auto-bootstrapped (it never
##   needs a public issuer). When BOTH dataCert.enabled and
##   dataIngress.tls.secretName are set, dataIngress.tls.secretName wins —
##   operators should set only one of them.
## @param dataCert.issuerName cert-manager ClusterIssuer name (e.g. letsencrypt-prod).
## @param dataCert.issuerKind cert-manager issuer kind: ClusterIssuer or Issuer.
## @param dataCert.secretName Secret name where cert-manager stores the certificate.
dataCert:
  enabled: false
  issuerName: "letsencrypt-prod"
  issuerKind: "ClusterIssuer"
  secretName: ""

## @section Prometheus ServiceMonitor

## @param serviceMonitor.enabled Enable Prometheus ServiceMonitor.
## @param serviceMonitor.labels [object] Labels applied to the ServiceMonitor.
## @param serviceMonitor.interval Scrape interval.
## @param serviceMonitor.scrapeTimeout Scrape timeout.
serviceMonitor:
  enabled: false
  labels: {}
  interval: 30s
  scrapeTimeout: 10s

## @section Subchart overrides
## @descriptionStart
## Subchart defaults forwarded to each dependency. Each dependency is toggled
## with its own `enabled` flag directly in its section. All PVC-bearing
## subcharts support storageClassName (empty = cluster default StorageClass).
## @descriptionEnd

## @skip opentelemetry-collector
## @param opentelemetry-collector.enabled Install OpenTelemetry Collector subchart.
opentelemetry-collector:
  enabled: true
  mode: deployment
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.108.0"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
  config:
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
            # Match the supervisor's otel.ingestMaxBodySize (64 MiB) so large
            # OTLP log batches are not rejected by the collector.
            max_request_body_size: 67108864
    processors:
      batch: {}
      transform/logs:
        log_statements:
          - context: log
            statements:
              - set(attributes["trace_id"], trace_id.string)
              - set(attributes["span_id"], span_id.string)
              - set(attributes["loki.attribute.labels"], "trace_id,span_id")
    exporters:
      otlphttp/tempo:
        endpoint: http://{{ include "dagger-kubernetes.otelTempoService" . }}.{{ .Release.Namespace }}.svc:4318
        tls:
          insecure: true
      loki:
        endpoint: http://{{ include "dagger-kubernetes.otelLokiService" . }}.{{ .Release.Namespace }}.svc:3100/loki/api/v1/push
        tls:
          insecure: true
      prometheusremotewrite:
        endpoint: http://{{ include "dagger-kubernetes.otelVictoriaService" . }}.{{ .Release.Namespace }}.svc:8428/prometheus/api/v1/write
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/tempo]
        logs:
          receivers: [otlp]
          processors: [transform/logs, batch]
          exporters: [loki]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheusremotewrite]

## @skip minio
## @param minio.enabled Install MinIO subchart (S3-compatible object store). Default S3 store for worker snapshots, CLI cache, and BuildKit cache GC.
minio:
  enabled: true
  mode: standalone
  ## @param minio.replicas Number of MinIO replicas (standalone mode = 1).
  replicas: 1
  ## @param minio.image.repository MinIO container image repository.
  ## @param minio.image.tag MinIO container image tag.
  image:
    repository: quay.io/minio/minio
    tag: RELEASE.2024-12-18T13-15-44Z
  ## @param minio.resources.requests.cpu MinIO CPU request.
  ## @param minio.resources.requests.memory MinIO memory request.
  ## @param minio.resources.limits.cpu MinIO CPU limit.
  ## @param minio.resources.limits.memory MinIO memory limit.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  ## @param minio.persistence.enabled Enable PVC for MinIO data.
  ## @param minio.persistence.storageClass StorageClass for the MinIO PVC (empty = cluster default).
  ## @param minio.persistence.size PVC size for MinIO object storage.
  persistence:
    enabled: true
    storageClass: ""
    size: 50Gi
  ## @param minio.rootUser MinIO root access key. Dev default; MUST be changed in production.
  rootUser: "minioadmin"
  ## @param minio.rootPassword MinIO root secret key. Dev default; MUST be changed in production.
  rootPassword: "minioadmin"
  ## @param minio.users [array] Extra MinIO users to create (default empty: the built-in console user is disabled).
  users: []
  ## @param minio.buckets [array] Buckets to create on startup. The default "dagger-cache" bucket is always created; "image-cache" backs the local image mirror when imageCache.enabled.
  buckets:
    - name: dagger-cache
      policy: none
      purge: false
    - name: image-cache
      policy: none
      purge: false
  ## @param minio.service.type MinIO service type.
  ## @param minio.service.port MinIO API port.
  service:
    type: ClusterIP
    port: 9000
  ## @param minio.consoleService.type MinIO Console service type.
  ## @param minio.consoleService.port MinIO Console port.
  consoleService:
    type: ClusterIP
    port: 9001
  ## @param minio.podAnnotations [object] Annotations added to the MinIO pod.
  podAnnotations: {}
  ## @param minio.nodeSelector [object] Node selector for MinIO pod scheduling.
  nodeSelector: {}
  ## @param minio.tolerations [array] Tolerations for MinIO pod scheduling.
  tolerations: []
  ## @param minio.affinity [object] Affinity rules for MinIO pod scheduling.
  affinity: {}
  ## @param minio.podSecurityContext.runAsUser User ID for the MinIO container.
  ## @param minio.podSecurityContext.runAsGroup Group ID for the MinIO container.
  ## @param minio.podSecurityContext.fsGroup Filesystem group for mounted volumes.
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  ## @param minio.containerSecurityContext.allowPrivilegeEscalation Allow privilege escalation.
  ## @param minio.containerSecurityContext.capabilities.drop [array] Linux capabilities to drop.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]

## @skip tempo
## @param tempo.enabled Install Grafana Tempo subchart (traces).
tempo:
  enabled: true
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""
  tempo:
    ## @param tempo.tempo.retention Trace retention duration. Spans are NOT deleted by
    ## the supervisor's history purge; set this to match (or exceed)
    ## supervisor.config.history.gc.maxAge so spans age out alongside the purge.
    retention: 720h
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi

## @skip loki
## @param loki.enabled Install Grafana Loki subchart (logs).
loki:
  enabled: true
  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  loki:
    ## @param loki.auth_enabled Enable Loki multi-tenancy/auth. Disabled because
    ## the supervisor and OTel collector talk to Loki without an X-Scope-OrgID.
    auth_enabled: false
    ## @param loki.commonConfig.replication_factor Loki replication factor.
    ## Must be 1 for SingleBinary mode (single replica), otherwise writes fail
    ## with "at least 2 live replicas required".
    commonConfig:
      replication_factor: 1
    ## History purge (supervisor.config.history.gc.*) calls POST /loki/api/v1/delete.
    ## Deletion is enabled by default: the Loki compactor runs with retention
    ## enabled and a delete_request_store configured, and deletion_mode is set to
    ## filter-and-delete. For object-storage deployments, change
    ## compactor.delete_request_store to the S3/GCS bucket used for delete requests.
    limits_config:
      deletion_mode: filter-and-delete
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
    useTestSchema: true
    storage:
      bucketNames:
        chunks: chunks
        ruler: ruler

## @skip victoria
## @param victoria.enabled Install VictoriaMetrics subchart (metrics).
## @param victoria.server.scrape.enabled Enable VictoriaMetrics' built-in Prometheus scraper. The subchart's default scrape config already includes the `kubernetes-nodes-cadvisor` job (kubelet `/metrics/cadvisor`), which supplies the `container_*` series the pipeline-view engine-metrics card queries; the subchart's ClusterRole grants `nodes/metrics` when scraping is enabled. Do NOT add a second cAdvisor job: duplicate jobs double every summed series.
victoria:
  enabled: true
  server:
    persistentVolume:
      enabled: true
      size: 20Gi
      storageClassName: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    scrape:
      enabled: true

## @skip grafana
## @param grafana.enabled Install Grafana subchart (dashboards with auto-provisioned datasources).
grafana:
  enabled: true
  adminPassword: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource

## @section PodDisruptionBudget

## @param podDisruptionBudget.enabled Enable PodDisruptionBudget for the supervisor StatefulSet.
## @param podDisruptionBudget.maxUnavailable Maximum number of unavailable pods during voluntary disruption.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

## @section Dex (OIDC identity provider, optional subchart)

## @param dex.enabled Install the Dex OIDC IdP subchart. Off by default. When enabled, the
##   supervisor's auth.oauth (provider "oidc") must point at the issuer URL below. Pair with
##   openldap.enabled to obtain group membership (the Dex "local" passwordDB connector has no groups).
dex:
  enabled: false
  image:
    repository: ghcr.io/dexidp/dex
    tag: "v2.44.0"
  https:
    enabled: false          # TLS terminates at the ingress
  replicaCount: 1
  # config is passed verbatim to Dex as config.yaml (configSecret.create defaults true).
  config:
    issuer: "https://dex-test.home.webcenter.fr"
    storage:
      type: memory          # in-memory: a stateless Dex restart invalidates all refresh tokens (#30 trigger)
    web:
      http: "0.0.0.0:5556"
    oauth2:
      skipApprovalScreen: true
      refreshTokens:
        # Short expiry to exercise issue #30 quickly on the test release. This is
        # TEST tuning — the production "never re-auth" recipe lives in docs/README.md.
        absoluteLifetime: "10m"
        validIfNotUsedFor: "5m"
        # Must comfortably exceed auth.oauth.revalidateInterval (30s): Dex rotates
        # the refresh token on every grant, but only the Raft leader can persist a
        # rotation (followers log "not the raft leader"). If the leader does not
        # revalidate within reuseInterval of a follower-side rotation, the stored
        # token generation is superseded and the credential strands until the next
        # Dex login. Live validation missed a 1m window by 5s; 5m gives headroom.
        reuseInterval: "5m"
    expiry:
      # Dex bakes the groups claim into the access token at issuance and the
      # default id/access-token validity is 24h — a group removal would only
      # surface at the next credential refresh (up to a day). Shortening it to
      # 1m makes oauth2 refresh on every revalidation (expiry delta is 60s), so
      # Dex re-queries LDAP and group changes are detected within
      # auth.oauth.revalidateInterval. TEST tuning only.
      idTokens: "1m"
    staticClients:
      - id: dagger-kubernetes
        name: Dagger Kubernetes
        secret: ""          # MUST equal auth.oauth.clientSecret (mismatch -> invalid_client at the token endpoint)
        redirectURIs:
          - "https://dagger-test.home.webcenter.fr/api/v1/auth/oauth/oidc/callback"
    connectors:
      - type: ldap
        id: ldap
        name: OpenLDAP
        config:
          host: "dagger-kubernetes-openldap:389"   # set via --set to <release>-openldap.<ns>.svc:389 on a named release
          insecureNoSSL: true                      # in-cluster plaintext LDAP (dev/test only)
          bindDN: "cn=admin,dc=example,dc=org"
          bindPW: "admin"                          # MUST equal openldap.adminPassword
          usernamePrompt: "Email Address"
          userSearch:
            baseDN: "ou=users,dc=example,dc=org"
            filter: "(objectClass=inetOrgPerson)"
            username: mail
            idAttr: uid
            emailAttr: mail
            nameAttr: cn
            preferredUsernameAttr: uid
          groupSearch:
            baseDN: "ou=groups,dc=example,dc=org"
            filter: "(objectClass=groupOfNames)"
            userMatchers:
              # groupOfNames members are DNs, so the matcher must be "DN" (Dex then
              # filters (member=<user DN>)). userAttr: uid would filter (member=jane)
              # and never match DN-valued members (dex v2.44.0 connector/ldap/ldap.go).
              - userAttr: DN
                groupAttr: member
            nameAttr: cn
  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: dex-test.home.webcenter.fr
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: dex-tls
        hosts: ["dex-test.home.webcenter.fr"]

## @section OpenLDAP (LDAP backend for Dex, optional subchart)

## @param openldap.enabled Install an in-cluster OpenLDAP that Dex's ldap connector authenticates
##   against (provides groups + refresh tokens + preferred_username). Off by default.
##   Dev/test only: plaintext LDAP, example credentials. Uses the community jp-gouin
##   openldap chart (bitnami/openldap was removed from the bitnami repo). Caveat: that
##   repo is archived (read-only since 2026-01-31) and the pinned 2.0.4 chart runs the
##   Osixia image (osixia/openldap:1.4.0, not Bitnami) — both remain fetchable but are
##   effectively frozen; accepted for a dev/test-only subchart (ADR-042).
openldap:
  enabled: false
  replicaCount: 1
  # cn=admin,dc=example,dc=org bind password; MUST equal dex.config.connectors[0].config.bindPW.
  adminPassword: "admin"
  configPassword: "admin"
  image:
    # Must render a NON-empty name: an empty value renders the subchart's
    # `imagePullSecrets: [- name:]` as null, which poisons Helm's 3-way patch
    # for every later upgrade ("map[] does not contain declared merge key:
    # name"). A missing secret is only a kubelet warning for a public image.
    pullSecret: "openldap-pull"
  env:
    LDAP_TLS: "false"         # plaintext LDAP on :389 (Dex insecureNoSSL; dev/test only)
  tls:
    enabled: false            # no TLS secret mounted
  replication:
    enabled: false            # single test instance
  ltb-passwd:
    enabled: false            # chart defaults true (extra UI + ingress) — not wanted
  phpldapadmin:
    enabled: false            # chart defaults true (extra UI + ingress) — not wanted
  # Seed the directory Dex authenticates against: user jane (jane@example.com /
  # password) in ou=users,dc=example,dc=org and group "devs" (cn=devs) in
  # ou=groups,dc=example,dc=org with jane as member (DN-valued member, matched
  # by the Dex ldap connector's userAttr: DN matcher).
  customLdifFiles:
    01-test-users.ldif: |-
      dn: ou=users,dc=example,dc=org
      objectClass: top
      objectClass: organizationalUnit
      ou: users

      dn: ou=groups,dc=example,dc=org
      objectClass: top
      objectClass: organizationalUnit
      ou: groups

      dn: uid=jane,ou=users,dc=example,dc=org
      objectClass: top
      objectClass: person
      objectClass: organizationalPerson
      objectClass: inetOrgPerson
      uid: jane
      cn: Jane Doe
      sn: Doe
      mail: jane@example.com
      userPassword: password

      dn: cn=devs,ou=groups,dc=example,dc=org
      objectClass: top
      objectClass: groupOfNames
      cn: devs
      member: uid=jane,ou=users,dc=example,dc=org
