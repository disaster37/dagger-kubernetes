# dagger-kubernetes Helm chart values
# ---------------------------------------------------------------------------
# Copy to your own values file and override as needed, e.g.:
#   helm install dagger-kubernetes ./deploy/helm/dagger-kubernetes -f my-values.yaml

## @section Chart metadata

## @param nameOverride [string] Override the chart name used in resource labels.
nameOverride: ""
## @param fullnameOverride [string] Override the full name of the release.
fullnameOverride: ""
## @param namespace [string] Namespace for the supervisor and subchart dependencies. Defaults to the release namespace when empty.
namespace: ""

## @section Supervisor (control-plane pod)

## @param supervisor.enabled Enable the supervisor (control plane + data plane) and its resources.
## @param supervisor.image.repository Supervisor container image repository.
## @param supervisor.image.tag Image tag (empty defaults to Chart.appVersion).
## @param supervisor.image.pullPolicy Image pull policy.
## @param supervisor.image.pullSecrets [array] Image pull secrets for private registries.
supervisor:
  enabled: true
  image:
    repository: ghcr.io/disaster37/dagger-kubernetes
    tag: ""
    pullPolicy: IfNotPresent
    pullSecrets: []
## @param supervisor.replicaCount Number of supervisor pods. Single source of truth for the Raft cluster size: each supervisor pod is one Raft voter, so the voter count is derived from this value (never asked separately). Use an odd number >= 3 for quorum fault tolerance (a 2-node cluster has no failure tolerance).
  replicaCount: 3
## @param supervisor.resources.requests.cpu Supervisor CPU request.
## @param supervisor.resources.requests.memory Supervisor memory request.
## @param supervisor.resources.limits.cpu Supervisor CPU limit.
## @param supervisor.resources.limits.memory Supervisor memory limit.
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
## @param supervisor.persistence.enabled Enable a per-pod PVC for the Raft data directory (StatefulSet volumeClaimTemplate). disabled = emptyDir (dev only).
## @param supervisor.persistence.storageClass StorageClass for the supervisor PVC (empty = cluster default).
## @param supervisor.persistence.size PVC size for each supervisor pod's Raft data directory.
  persistence:
    enabled: true
    storageClass: ""
    size: 2Gi
## @param supervisor.podAnnotations [object] Annotations added to the supervisor pod.
  podAnnotations: {}
## @param supervisor.podSecurityContext.runAsNonRoot Run supervisor container as non-root.
## @param supervisor.podSecurityContext.runAsUser User ID for the supervisor container.
## @param supervisor.podSecurityContext.runAsGroup Group ID for the supervisor container.
## @param supervisor.podSecurityContext.fsGroup Filesystem group for mounted volumes.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
## @param supervisor.securityContext.allowPrivilegeEscalation Allow privilege escalation.
## @param supervisor.securityContext.readOnlyRootFilesystem Mount root filesystem as read-only.
## @param supervisor.securityContext.capabilities.drop [array] Linux capabilities to drop.
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
## @param supervisor.nodeSelector [object] Node selector for supervisor pod scheduling.
  nodeSelector: {}
## @param supervisor.tolerations [array] Tolerations for supervisor pod scheduling.
  tolerations: []
## @param supervisor.affinity [object] Affinity rules for supervisor pod scheduling.
  affinity: {}
## @param supervisor.serviceAccount.annotations [object] Annotations for the supervisor ServiceAccount.
## @param supervisor.serviceAccount.clusterScope Use ClusterRole instead of namespaced Role/RoleBinding (cluster-wide access - security-sensitive).
  serviceAccount:
    annotations: {}
    clusterScope: false
## @param supervisor.extraEnv [array] Extra environment variables for the supervisor container.
  extraEnv: []

## @section Supervisor configuration

## @descriptionStart
## URLs are NOT asked — they are computed from the exposition:
## - `server.public_url` (UI + API): `https://<ingress host>` when the ingress
##   has TLS, `http://<ingress host>` without TLS; `<service.control.host>`
##   for LoadBalancer/NodePort; else the internal
##   `https://<release>-control.<namespace>.svc:<port>`.
## - `server.data_hostname` (engine data plane): `<dataIngress.host>` when the
##   data ingress is enabled, `<service.data.host>` for LoadBalancer/NodePort,
##   else `<release>-data.<namespace>.svc:<port>`.
## - `server.pipeline_url` is dropped: pipeline-view links use the same URL as
##   the UI.
## Container paths/ports are fixed (control :8080, data :8443, raft :8081,
## data dir /var/lib/dagger-kubernetes); only the Service ports are
## configurable.
## @descriptionEnd

## @param supervisor.config.raft.tls.enabled Enable mTLS for the Raft transport.
## @param supervisor.config.raft.tls.clientAuth Require and verify peer client certs (mTLS).
##   The Raft voter count is NOT asked: it is derived from supervisor.replicaCount.
##   Everything else is derived automatically: node IDs come from the
##   StatefulSet pod names, peer discovery from the headless Service DNS, and
##   the internal CA is auto-bootstrapped in the <release>-raft-ca Secret.
  config:
    raft:
## @param supervisor.config.raft.clusterDomain Cluster DNS suffix appended to peer addresses (`<pod>.<headless>.<ns>.svc.<clusterDomain>`). Default `""` ends peer addresses at `.svc` (no suffix); set `"cluster.local"` (or your cluster's real domain) to advertise full FQDNs.
      clusterDomain: ""
      tls:
        enabled: true
        clientAuth: true
## @param supervisor.config.telemetry.collectorUrl OTel collector URL (auto-wired when the opentelemetry-collector subchart is enabled).
## @param supervisor.config.telemetry.tempoUrl Tempo URL for trace queries (auto-wired when the tempo subchart is enabled).
## @param supervisor.config.telemetry.lokiUrl Loki URL for log queries (auto-wired when the loki subchart is enabled).
## @param supervisor.config.telemetry.victoriaUrl VictoriaMetrics URL for metric queries (auto-wired when the victoria subchart is enabled).
    telemetry:
      collectorUrl: ""
      tempoUrl: ""
      lokiUrl: ""
      victoriaUrl: ""
## @param supervisor.config.cache.backend Cache backend type: registry (OCI) or s3.
## @param supervisor.config.cache.publicHost Dedicated cache vhost engines push/pull through (empty = derived `cache.<control-plane host>`, itself computed from the ingress/service exposition). Must differ from the control-plane host. Free-form: set a one-level name (e.g. `dagger-cache.company.com`) when your wildcard certificate does not cover the derived sub-subdomain. Also drives the extra ingress host rule + TLS SAN entry when ingress is enabled.
## @param supervisor.config.cache.authToken Engine→proxy bearer for the cache. Rendered into the engine-registry-auth Secret (key `token`); the supervisor reads it from there. Empty = "placeholder".
## @param supervisor.config.cache.registries [array] Multi-backend list of {id, internalAddr, username, password, passwordSecret}. Empty = single-backend mode (the bundled registry). The proxy load-balances across backends least-charged first (registry cache size). password must stay empty in Helm; use passwordSecret to reference a K8s Secret.
## @param supervisor.config.cache.registries[].passwordSecret.name K8s Secret name holding the backend password (rendered as a reference, never the secret itself).
## @param supervisor.config.cache.registries[].passwordSecret.key Key inside the Secret holding the password (empty = "password").
## @param supervisor.config.cache.s3.bucket S3 bucket name (when backend=s3).
## @param supervisor.config.cache.s3.region S3 region (when backend=s3).
    cache:
      backend: "registry"
      publicHost: ""
      authToken: ""
      registries: []
      s3:
        bucket: ""
        region: ""
## @param supervisor.config.history.gc.enabled Master switch for the history auto-purge sweeper.
## @param supervisor.config.history.gc.maxAge Purge traces older than this (30d default). Duration strings accept Go units plus "d" (day) and "w" (week), e.g. "7d", "1w".
## @param supervisor.config.history.gc.schedule History sweeper ticker interval.
    history:
      gc:
        enabled: false
        maxAge: "720h"
        schedule: "1h"
## @param supervisor.config.fleet.maxReplicasPerVersion Maximum engine replicas per Dagger version.
## @param supervisor.config.fleet.maxSessionsPerReplica Maximum concurrent sessions per engine replica.
## @param supervisor.config.fleet.replicaIdleTtl Idle TTL before scaling down an engine replica.
## @param supervisor.config.fleet.versionRetention Idle version GC: delete a version's StatefulSet + Service after this long with zero replicas and no pinned sessions (<= 0 disables; positive values < 1m rejected).
## @param supervisor.config.fleet.engineImageRegistry Engine container image registry.
## @param supervisor.config.fleet.engineStorageClass StorageClass for engine PVCs (empty = cluster default).
## @param supervisor.config.fleet.engineStorageSize PVC size for each engine.
## @param supervisor.config.fleet.enginePvcLabels [object] Extra labels added to engine PVCs (merged with managed labels app/version, which take precedence). Keys may contain dots (e.g. `recurring-job-group.longhorn.io/nobackup`) and are preserved verbatim.
## @param supervisor.config.fleet.engineCPURequest Engine CPU request.
## @param supervisor.config.fleet.engineCPULimit Engine CPU limit.
## @param supervisor.config.fleet.engineMemoryRequest Engine memory request.
## @param supervisor.config.fleet.engineMemoryLimit Engine memory limit.
## @param supervisor.config.fleet.engineTerminationGraceSeconds Engine pod termination grace period.
## @param supervisor.config.fleet.enginePullPolicy Engine image pull policy.
## @param supervisor.config.fleet.enginePrivileged Run engine container in privileged mode.
##   Required by BuildKit/Dagger engine for mount/overlay operations that need
##   full root capabilities (rootless mode is not supported by the Dagger
##   engine in this configuration). Do not disable unless you have verified
##   your engine version runs unprivileged.
## @param supervisor.config.fleet.engineNodeSelector [object] Node selector for engine pods.
## @param supervisor.config.fleet.engineTolerations [array] Tolerations for engine pods.
## @param supervisor.config.fleet.engineExtraArgs [array] Additional CLI args passed to the engine.
## @param supervisor.config.fleet.engineExtraEnv [object] Extra env vars on engine pods.
## @param supervisor.config.fleet.engineExtraEnvFrom [object] Extra env vars sourced from Secret keys on engine pods: map of env name -> {secretName, key} (camelCase keys, rendered verbatim into the app config).
## @param supervisor.config.fleet.engineCaSecret Secret with custom CA PEM bundle for engines (empty = disabled).
## @param supervisor.config.fleet.engineCaSecretKey Key inside engineCaSecret containing the CA cert.
## @param supervisor.config.fleet.engineDockerConfig Base64-encoded Docker config.json
##   (auths for private registries) used by engine image pulls. Stored verbatim
##   in the `engine-registry-auth` Secret `data` key `.dockerconfigjson`
##   (already base64 — do NOT pre-decode): Kubernetes base64-decodes it exactly
##   once on mount, so engine pods read raw JSON at
##   `/etc/dagger/.dockerconfigjson`. Empty = `e30K` (base64 of `{}`). This is
##   NOT an imagePullSecret: the supervisor never attaches it to the engine
##   StatefulSet's `imagePullSecrets`; it is provided as a Docker config file
##   for the engine's own registry authentication.
## @param supervisor.config.fleet.engineDebug Enable engine.toml [debug].
## @param supervisor.config.fleet.engineLogFormat Engine log format (json, text; empty omits).
## @param supervisor.config.fleet.engineRegistryMirrors [object] Engine registry mirrors (e.g. {"docker.io": ["mirror.gcr.io"]}).
    fleet:
      maxReplicasPerVersion: 3
      maxSessionsPerReplica: 8
      replicaIdleTtl: "5m"
      versionRetention: "24h"
      engineImageRegistry: "registry.dagger.io/engine"
      engineStorageClass: ""
      engineStorageSize: "50Gi"
      enginePvcLabels: {}
      engineCPURequest: "500m"
      engineCPULimit: "2000m"
      engineMemoryRequest: "1Gi"
      engineMemoryLimit: "8Gi"
      engineTerminationGraceSeconds: 120
      enginePullPolicy: "IfNotPresent"
      enginePrivileged: true
      engineNodeSelector: {}
      engineTolerations: []
      engineExtraArgs: []
      # engineExtraEnv: extra env vars for engine pods, e.g. proxy settings:
      # engineExtraEnv:
      #   HTTP_PROXY: "http://proxy.corp.example:3128"
      #   HTTPS_PROXY: "http://proxy.corp.example:3128"
      #   NO_PROXY: "localhost,127.0.0.1,.svc,.cluster.local"
      engineExtraEnv: {}
      # engineExtraEnvFrom: env vars sourced from K8s Secret keys
      # (map: env name -> {secretName, key}; rendered verbatim into the app
      # config). Use for credentials that must never appear in plaintext
      # config, e.g. an authenticated proxy:
      # engineExtraEnvFrom:
      #   HTTP_PROXY:
      #     secretName: "proxy-credentials"
      #     key: "http_proxy"            # secret value: "http://user:pass@proxy.corp.example:3128"
      #   HTTPS_PROXY:
      #     secretName: "proxy-credentials"
      #     key: "https_proxy"
      engineExtraEnvFrom: {}
      engineCaSecret: ""
      engineCaSecretKey: "ca.crt"
      engineDockerConfig: ""
      engineDebug: false
      engineLogFormat: "json"
      # engineRegistryMirrors: engine.toml registry mirrors (quote registry
      # names containing dots, or YAML nests them; the supervisor preserves
      # dotted keys such as "docker.io", "ghcr.io", "public.ecr.aws" verbatim):
      # engineRegistryMirrors:
      #   "docker.io": ["mirror.gcr.io", "my-mirror.corp.example"]
      engineRegistryMirrors: {}
## @param supervisor.config.leaseTtl Engine session lease TTL.
    leaseTtl: "2m"
## @param supervisor.config.version.floor Minimum supported Dagger engine version.
## @param supervisor.config.version.allowlist [array] Allowed Dagger versions (major.minor prefixes; empty = admit all versions >= floor).
    version:
      floor: "v0.19.0"
      allowlist: ["0.19", "0.20", "0.21"]
## @param supervisor.config.cli.enabled Enable on-the-fly Dagger CLI provisioning addon.
## @param supervisor.config.cli.cacheDir Cache dir for verified CLI tarballs (empty = <database.dir>/cli-cache).
## @param supervisor.config.cli.releaseListTtl Upstream release-list cache TTL.
## @param supervisor.config.cli.downloadTimeout Outbound upstream fetch timeout.
## @param supervisor.config.cli.upstream.releasesUrl Release discovery URL (mirror-able).
## @param supervisor.config.cli.upstream.downloadBase Tarball + checksums.txt base URL (mirror-able).
## @param supervisor.config.cli.upstream.githubToken Optional GitHub token for the releases API.
    cli:
      enabled: true
      cacheDir: ""
      releaseListTtl: "1h"
      downloadTimeout: "5m"
      upstream:
        releasesUrl: "https://api.github.com/repos/dagger/dagger/releases"
        downloadBase: "https://github.com/dagger/dagger/releases/download"
        githubToken: ""
## @param supervisor.config.logLevel Supervisor log level.
    logLevel: "info"
## @param supervisor.config.logFormat Supervisor log format (json, text).
    logFormat: "json"
## @param supervisor.config.otel.otlpEndpoint Supervisor OTLP export endpoint (empty disables).
    otel:
      otlpEndpoint: ""

## @section Authentication

## @param auth.bootstrapAdmin.username Bootstrap admin username.
## @param auth.bootstrapAdmin.password Bootstrap admin password. When empty, a random password is generated and logged once at first boot. Ignored when auth.bootstrapAdmin.secretRef.name is set.
## @param auth.bootstrapAdmin.secretRef.name [optional] K8s Secret name holding the bootstrap admin password (takes precedence over auth.bootstrapAdmin.password; the chart-managed <release>-admin-password Secret is not rendered).
## @param auth.bootstrapAdmin.secretRef.key Key inside the Secret holding the password (empty = "password").
## @param auth.jwt.secret JWT signing secret (HS256). Empty = auto-generated and persisted in DB. Ignored when auth.jwt.secretRef.name is set.
## @param auth.jwt.secretRef.name [optional] K8s Secret name holding the JWT secret (takes precedence over auth.jwt.secret; the chart-managed <release>-jwt Secret is not rendered).
## @param auth.jwt.secretRef.key Key inside the Secret holding the JWT secret (empty = "secret").
## @param auth.jwt.accessTtl JWT access token TTL.
## @param auth.jwt.refreshTtl JWT refresh token TTL. Duration strings accept Go units plus "d" (day) and "w" (week), e.g. "7d".
## @param auth.oauth.enabled Enable OAuth2 authentication.
## @param auth.oauth.provider OAuth2 provider: "github" or "oidc" (generic OIDC: Dex, Keycloak, Google, Auth0, ...).
## @param auth.oauth.clientId OAuth2 client ID.
## @param auth.oauth.clientSecret OAuth2 client secret (rendered into the <release>-oauth Secret; injected as DAGGER_KUBERNETES_AUTH_OAUTH_CLIENT_SECRET). Ignored when auth.oauth.clientSecretRef.name is set.
## @param auth.oauth.clientSecretRef.name [optional] K8s Secret name holding the OAuth2 client secret (takes precedence over auth.oauth.clientSecret; the chart-managed <release>-oauth Secret is not rendered).
## @param auth.oauth.clientSecretRef.key Key inside the Secret holding the client secret (empty = "client_secret").
## @param auth.oauth.redirectUrl OAuth2 redirect URL (empty = computed `<publicUrl>/api/v1/auth/oauth/<provider>/callback`).
## @param auth.oauth.allowedOrgs [array] Allowed OAuth organizations (github: org membership; oidc: deprecated alias for allowedGroups).
## @param auth.oauth.allowedTeams [array] (github) Allowed "org/team" slugs; when set with allowedOrgs, both must be satisfied.
## @param auth.oauth.allowedGroups [array] (oidc) Allowed provider group names (groups-claim allowlist; union with allowedOrgs).
## @param auth.oauth.groupMappings [array] Regex group mapping: list of {pattern, replacement} mapping provider groups to supervisor group names (first-match-wins; no match drops the group).
## @param auth.oauth.defaultGroup Default group for OAuth users.
## @param auth.oauth.cookieSecure Force the Secure flag on the oauth_state cookie (set true when TLS terminates in front of the supervisor).
## @param auth.oauth.issuerUrl (oidc) OIDC issuer URL (e.g. https://dex.example.com).
## @param auth.oauth.scopes [array] (oidc) OIDC scopes; "openid" is always appended.
## @param auth.oauth.usernameClaim (oidc) OIDC username claim (fallback: email).
## @param auth.oauth.groupsClaim (oidc) OIDC groups claim (array or single string).
## @param auth.cookie.accessName Access-JWT session cookie name (httpOnly).
## @param auth.cookie.refreshName Refresh-JWT session cookie name (httpOnly).
## @param auth.cookie.secure Force the Secure flag on session cookies.
## @param auth.cors.allowedOrigins [array] Exact-match Origin allowlist.
auth:
  bootstrapAdmin:
    username: "admin"
    password: ""
    secretRef:
      name: ""
      key: "password"
  jwt:
    secret: ""
    secretRef:
      name: ""
      key: "secret"
    accessTtl: "15m"
    refreshTtl: "168h"
  oauth:
    enabled: false
    provider: "github"
    clientId: ""
    clientSecret: ""
    clientSecretRef:
      name: ""
      key: "client_secret"
    redirectUrl: ""
    allowedOrgs: []
    # allowedOrgs example (GitHub org membership):
    # allowedOrgs: ["acme"]
    allowedTeams: []
    # allowedTeams example (GitHub team restriction, "org/team"):
    # allowedTeams: ["acme/eng"]
    allowedGroups: []
    # allowedGroups example (OIDC groups-claim allowlist):
    # allowedGroups: ["devs", "platform"]
    groupMappings: []
    # groupMappings example (regex → supervisor group name):
    # groupMappings:
    #   - pattern: '^github\.com/acme-(.*)$'
    #     replacement: 'acme-$1'
    #   - pattern: '^ldap/(.+)$'
    #     replacement: '$1'
    defaultGroup: ""
    cookieSecure: false
    issuerUrl: ""
    scopes: ["openid", "profile", "email"]
    usernameClaim: "preferred_username"
    groupsClaim: "groups"
  cookie:
    accessName: "dagger_kubernetes_access"
    refreshName: "dagger_kubernetes_refresh"
    secure: false
  cors:
    allowedOrigins: []

# ---- GitHub OAuth example ---------------------------------------------
# auth:
#   oauth:
#     enabled: true
#     provider: "github"
#     clientId: "Ov23li...github-app-client-id"
#     clientSecretRef: { name: "github-oauth", key: "client_secret" }
#     redirectUrl: "https://supv.example.com/api/v1/auth/oauth/github/callback"
#     allowedOrgs: ["acme"]          # optional org restriction
#     allowedTeams: ["acme/eng"]     # optional team restriction (AND-ed with orgs)
#     groupMappings:
#       - pattern: '^acme$'
#         replacement: 'acme-all'
#
# ---- Generic OIDC example (Dex) ---------------------------------------
# auth:
#   internal:
#     enabled: false                  # OIDC-only login
#   oauth:
#     enabled: true
#     provider: "oidc"
#     issuerUrl: "https://dex.example.com"
#     clientId: "dagger-kubernetes"
#     clientSecretRef: { name: "dex-oauth", key: "client_secret" }
#     redirectUrl: "https://supv.example.com/api/v1/auth/oauth/oidc/callback"
#     scopes: ["openid", "profile", "email", "groups"]
#     usernameClaim: "preferred_username"
#     groupsClaim: "groups"
#     allowedGroups: ["devs"]         # optional allowlist
#     groupMappings:
#       - pattern: '^dex:dev-(.*)$'
#         replacement: 'dev-$1'

## @section TLS and certificates

## @param tls.provider TLS provider for the server certificate:
##   "embedded" (default, minting CA issues a self-signed server cert),
##   "cert-manager" (cert-manager issues the server cert, see dataCert/dataIngress below),
##   or "external" (operator-managed PEM files at certPath/keyPath).
##   The minting CA is auto-bootstrapped for every provider.
## @param tls.certPath Server certificate path (only "external"). cert-manager auto-wires the mounted data-tls secret.
## @param tls.keyPath Server key path (only "external"). cert-manager auto-wires the mounted data-tls secret.
## @param tls.clientCertTtl Client certificate TTL (engine session certs minted from the CA).
## @param tls.caCrt [optional] PEM-encoded minting CA certificate. Leave empty to AUTO-BOOTSTRAP on first boot.
## @param tls.caKey [optional] PEM-encoded minting CA private key. Leave empty to AUTO-BOOTSTRAP on first boot.
##   When both are empty (the default), the supervisor generates the minting CA
##   on first boot and stores it in the <release>-minting-ca Secret. Only set
##   these to bring an existing CA (e.g. migrating from a prior deployment).
## @param tls.crt [optional] PEM-encoded server certificate (only needed for provider "external").
## @param tls.key [optional] PEM-encoded server private key (only needed for provider "external").
tls:
  provider: "embedded"
  certPath: ""
  keyPath: ""
  clientCertTtl: "2h"
  caCrt: ""
  caKey: ""
  crt: ""
  key: ""

## @section Services

## @param service.control.type Control-plane service type.
## @param service.control.port Control-plane service port (maps to the fixed supervisor :8080).
## @param service.control.nodePort Control-plane service node port (when type=NodePort).
## @param service.control.host Routable hostname/IP for the control plane when exposed via LoadBalancer/NodePort (required then; unused with ingress or ClusterIP).
service:
  control:
    type: ClusterIP
    port: 80
    nodePort: ""
    host: ""
## @param service.data.type Data-plane service type. ClusterIP when using ingress.
## @param service.data.port Data-plane service port (maps to the fixed supervisor :8443).
## @param service.data.nodePort Data-plane node port (when type=NodePort and no ingress; required then, auto-assigned ports are unknown to the chart).
## @param service.data.host Routable hostname/IP for the data plane when exposed via LoadBalancer/NodePort (required then; unused with dataIngress or ClusterIP).
  data:
    type: ClusterIP
    port: 443
    nodePort: ""
    host: ""

## @section Ingress

## @param ingress.enabled Enable control-plane Ingress (web UI + API).
## @param ingress.className Ingress class name (empty = default ingress controller).
## @param ingress.annotations [object] Ingress annotations.
## @param ingress.hosts [array] Ingress host rules.
## @param ingress.hosts[].host Hostname for the ingress rule.
## @param ingress.hosts[].paths[].path URL path for the ingress rule.
## @param ingress.hosts[].paths[].pathType Path matching type (Prefix, Exact, ImplementationSpecific).
## @param ingress.tls [array] Ingress TLS configuration.
ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: supv.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

## @section Data-plane Ingress (mTLS passthrough)

## @param dataIngress.enabled Expose data plane via TLS passthrough on a dedicated host.
##   Creates an ingress with nginx.ingress.kubernetes.io/ssl-passthrough: "true".
##   The data plane cert must include this hostname (embedded provider adds it
##   automatically; for external/cert-manager providers, ensure the cert has it).
## @param dataIngress.host Hostname for the data plane (e.g. data.supv.example.com).
##   Must resolve to the same IP as the control plane ingress.
## @param dataIngress.className Ingress class name.
## @param dataIngress.annotations [object] Additional ingress annotations.
## @param dataIngress.tls.secretName [string] Secret name for the data-plane TLS cert.
##   When set, cert-manager issues a Let's Encrypt certificate from this Ingress
##   (add the annotation `cert-manager.io/cluster-issuer: <issuer>` to dataIngress.annotations).
##   The secret is mounted into the supervisor, which serves it over ssl-passthrough.
##   Takes precedence over dataCert.secretName.
dataIngress:
  enabled: false
  host: "data.supv.example.com"
  className: ""
  annotations: {}
  tls:
    secretName: ""

## @section Data-plane certificate (cert-manager)

## @param dataCert.enabled Provision a certificate for the data plane via
##   cert-manager (e.g. Let's Encrypt). Requires cert-manager to be installed
##   in the cluster and `tls.provider: "cert-manager"`. The
##   resulting Secret is mounted as the supervisor's server certificate; the
##   chart auto-wires certPath/keyPath to it. The minting CA is still
##   auto-bootstrapped (it never needs a public issuer).
## @param dataCert.issuerName cert-manager ClusterIssuer name (e.g. letsencrypt-prod).
## @param dataCert.issuerKind cert-manager issuer kind: ClusterIssuer or Issuer.
## @param dataCert.secretName Secret name where cert-manager stores the certificate.
dataCert:
  enabled: false
  issuerName: "letsencrypt-prod"
  issuerKind: "ClusterIssuer"
  secretName: ""

## @section Prometheus ServiceMonitor

## @param serviceMonitor.enabled Enable Prometheus ServiceMonitor.
## @param serviceMonitor.labels [object] Labels applied to the ServiceMonitor.
## @param serviceMonitor.interval Scrape interval.
## @param serviceMonitor.scrapeTimeout Scrape timeout.
serviceMonitor:
  enabled: false
  labels: {}
  interval: 30s
  scrapeTimeout: 10s

## @section Subchart overrides
## @descriptionStart
## Subchart defaults forwarded to each dependency. Each dependency is toggled
## with its own `enabled` flag directly in its section. All PVC-bearing
## subcharts support storageClassName (empty = cluster default StorageClass).
## @descriptionEnd

## @skip opentelemetry-collector
## @param opentelemetry-collector.enabled Install OpenTelemetry Collector subchart.
opentelemetry-collector:
  enabled: true
  mode: deployment
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.108.0"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
  config:
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
      transform/logs:
        log_statements:
          - context: log
            statements:
              - set(attributes["trace_id"], trace_id.string)
              - set(attributes["span_id"], span_id.string)
              - set(attributes["loki.attribute.labels"], "trace_id,span_id")
    exporters:
      otlphttp/tempo:
        endpoint: http://{{ .Release.Name }}-tempo:4318
        tls:
          insecure: true
      loki:
        endpoint: http://{{ .Release.Name }}-loki:3100/loki/api/v1/push
        tls:
          insecure: true
      prometheusremotewrite:
        endpoint: http://{{ .Release.Name }}-victoria-server:8428/prometheus/api/v1/write
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/tempo]
        logs:
          receivers: [otlp]
          processors: [transform/logs, batch]
          exporters: [loki]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheusremotewrite]

## @skip registry
## @param registry.enabled Install Docker Registry subchart (cache backend).
registry:
  enabled: true
  replicaCount: 1
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
  storage: filesystem
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

## @skip tempo
## @param tempo.enabled Install Grafana Tempo subchart (traces).
tempo:
  enabled: true
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""
  tempo:
    ## @param tempo.tempo.retention Trace retention duration. Spans are NOT deleted by
    ## the supervisor's history purge; set this to match (or exceed)
    ## supervisor.config.history.gc.maxAge so spans age out alongside the purge.
    retention: 720h
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi

## @skip loki
## @param loki.enabled Install Grafana Loki subchart (logs).
loki:
  enabled: true
  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 2000m
        memory: 2Gi
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  loki:
    ## @param loki.auth_enabled Enable Loki multi-tenancy/auth. Disabled because
    ## the supervisor and OTel collector talk to Loki without an X-Scope-OrgID.
    auth_enabled: false
    ## @param loki.commonConfig.replication_factor Loki replication factor.
    ## Must be 1 for SingleBinary mode (single replica), otherwise writes fail
    ## with "at least 2 live replicas required".
    commonConfig:
      replication_factor: 1
    ## History purge (supervisor.config.history.gc.*) calls POST /loki/api/v1/delete.
    ## Deletion is enabled by default: the Loki compactor runs with retention
    ## enabled and a delete_request_store configured, and deletion_mode is set to
    ## filter-and-delete. For object-storage deployments, change
    ## compactor.delete_request_store to the S3/GCS bucket used for delete requests.
    limits_config:
      deletion_mode: filter-and-delete
    compactor:
      retention_enabled: true
      delete_request_store: filesystem
    useTestSchema: true
    storage:
      bucketNames:
        chunks: chunks
        ruler: ruler

## @skip victoria
## @param victoria.enabled Install VictoriaMetrics subchart (metrics).
victoria:
  enabled: true
  server:
    persistentVolume:
      enabled: true
      size: 20Gi
      storageClassName: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

## @skip grafana
## @param grafana.enabled Install Grafana subchart (dashboards with auto-provisioned datasources).
grafana:
  enabled: true
  adminPassword: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource
