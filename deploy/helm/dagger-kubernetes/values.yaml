# dagger-kubernetes Helm chart values
# ---------------------------------------------------------------------------
# Copy to your own values file and override as needed, e.g.:
#   helm install dagger-kubernetes ./deploy/helm/dagger-kubernetes -f my-values.yaml

# --- Naming / namespace (chart-level) -------------------------------------
nameOverride: ""
fullnameOverride: ""
# Namespace for the supervisor and its subchart dependencies.
# Defaults to the release namespace when empty.
namespace: ""

# --- Supervisor (control-plane pod) ---------------------------------------
# Pod-level keys live under `supervisor:`; config under `supervisor.config.*`.
supervisor:
  image:
    repository: ghcr.io/disaster/dagger-kubernetes
    tag: ""                # defaults to Chart.appVersion when empty
    pullPolicy: IfNotPresent
    pullSecrets: []        # e.g. [{ name: ghcr-pull-secret }]
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # SQLite database PVC. disabled → emptyDir (all users/tokens lost on
  # pod restart — dev only). storageClass="" uses the cluster default.
  persistence:
    enabled: false
    storageClass: ""
    size: 1Gi
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  nodeSelector: {}
  tolerations: []
  affinity: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: ""
  serviceAccount:
    annotations: {}
    # clusterScope: false (default) → namespaced Role/RoleBinding limited to
    # the release namespace. Set true only if engine fleets span multiple
    # namespaces (grants cluster-wide access — security-sensitive).
    clusterScope: false
  extraEnv: []
  config:
    server:
      dataHostname: "data.supv.example.com"
      publicUrl: "https://supv.example.com"
    database:
      path: "/var/lib/dagger-cache/dagger-cache.db"
    auth:
      internal:
        enabled: true
        tokensFile: "/etc/dagger-cache/tokens"
      bootstrapAdmin:
        username: "admin"
        password: ""    # empty = random password logged once at first boot
      jwt:
        secret: ""      # empty = auto-generated and persisted in the DB
        accessTtl: "15m"
        refreshTtl: "168h"
      oauth:
        enabled: false
        provider: "github"
        clientId: "${OAUTH_CLIENT_ID}"
        clientSecret: "${OAUTH_CLIENT_SECRET}"
        redirectUrl: "https://supv.example.com/api/v1/auth/oauth/github/callback"
        allowedOrgs: ["acme"]
        defaultGroup: ""
    telemetry:
      # collectorUrl is derived from the otel-collector dependency when enabled.
      collectorUrl: ""
      tempoUrl: "http://tempo:3200"
      lokiUrl: "http://loki:3100"
      victoriaUrl: "http://victoria:8428"
    cache:
      backend: "registry"            # "registry" (OCI) or "s3"
      # registry is derived from the docker-registry dependency when enabled.
      registry: ""
      refPerVersion: true
      s3:
        bucket: ""
        region: ""
    fleet:
      minReplicasPerVersion: 0
      maxReplicasPerVersion: 3
      maxSessionsPerReplica: 8
      replicaIdleTtl: "5m"
      versionRetention: "24h"
      engineImageRegistry: "registry.dagger.io/engine"
      engineStorageClass: ""
      engineStorageSize: "50Gi"
      engineCPURequest: "500m"
      engineCPULimit: "2000m"
      engineMemoryRequest: "1Gi"
      engineMemoryLimit: "8Gi"
      engineTerminationGraceSeconds: 120
      enginePullPolicy: "IfNotPresent"
      enginePrivileged: true
      engineNodeSelector: {}
      engineTolerations: []
      engineExtraArgs: []
      engineExtraEnv: {}            # env vars on engine pods (e.g. proxy vars)
      engineExtraEnvFrom: {}        # env vars sourced from Secret keys
      engineCaSecret: ""            # Secret with custom CA PEM bundle; empty = disabled
      engineCaSecretKey: "ca.crt"   # key inside engineCaSecret
      engineDebug: false            # enable engine.toml [debug]
      engineLogFormat: "json"       # engine.toml [log] format; "" omits
      engineRegistryMirrors: {}     # e.g. {"docker.io": ["mirror.gcr.io"]}
    ca:
      clientCertTtl: "2h"
    leaseTtl: "2m"
    version:
      floor: "v0.19.0"
      allowlist: ["0.19", "0.20", "0.21"]
    logLevel: "info"
    logFormat: "json"               # supervisor log format: json | text
    otel:
      otlpEndpoint: ""               # empty disables the supervisor's own OTLP export

# --- Authentication secrets (chart-level) ----------------------------------
auth:
  # Static bearer tokens, one per line (newline-separated at runtime).
  # DEPRECATED: legacy fallback only. Migrate with `supervisor migrate-tokens`
  # then remove. See ADR-010.
  tokens: []
  # - "super-secret-token-1"
  # Optional JWT signing secret (HS256). When empty, the supervisor
  # auto-generates one on first boot and persists it in the SQLite DB.
  jwtSecret: ""

# --- Minting CA & TLS (chart-level, provide your own) ----------------------
ca:
  crt: ""    # PEM-encoded CA certificate
  key: ""    # PEM-encoded CA private key
tls:
  crt: ""    # PEM-encoded server certificate
  key: ""    # PEM-encoded server private key

# --- Services (chart-level) -----------------------------------------------
service:
  control:
    type: ClusterIP
    port: 80
    nodePort: ""
  data:
    type: LoadBalancer
    port: 443

# --- Ingress (chart-level) -------------------------------------------------
ingress:
  enabled: true
  className: ""
  annotations: {}
  hosts:
    - host: supv.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: supv-tls
  #    hosts:
  #      - supv.example.com

# --- Prometheus ServiceMonitor (chart-level) -------------------------------
serviceMonitor:
  enabled: false
  labels: {}
  interval: 30s
  scrapeTimeout: 10s

# --- Observability tools (enabled = install subchart) ----------------------
# Chart dependencies. Disable any tool and point the supervisor elsewhere.
tools:
  # OpenTelemetry Collector — receives OTLP from Dagger CLI & supervisor,
  # fans out to Tempo / Loki / Prometheus backends.
  otelCollector:
    enabled: true
  # Docker registry (OCI) — backs the remote shared cache (BuildKit blobs).
  registry:
    enabled: true
  # Grafana Tempo — distributed tracing backend, stores OTLP traces.
  tempo:
    enabled: true
  # Grafana Loki — log aggregation backend, stores OTLP logs.
  loki:
    enabled: true
  # VictoriaMetrics — PromQL-compatible metrics backend, stores OTLP metrics.
  victoria:
    enabled: true
  # Grafana — unified dashboards for Tempo, Loki, and VictoriaMetrics data.
  grafana:
    enabled: true

# --- Subchart overrides ----------------------------------------------------
# Forwarded to each dependency. All PVC-bearing subcharts support
# `storageClassName` (empty = cluster default StorageClass).
opentelemetry-collector:
  mode: deployment
  replicaCount: 1
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.108.0"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  service:
    type: ClusterIP
  # The collector subchart uses tpl() on config, so Go template expressions
  # like {{ .Release.Name }} are resolved correctly at install time.
  config:
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch: {}
    exporters:
      otlphttp/tempo:
        endpoint: http://{{ .Release.Name }}-tempo:4318
        tls:
          insecure: true
      loki:
        endpoint: http://{{ .Release.Name }}-loki:3100/loki/api/v1/push
        tls:
          insecure: true
      prometheusremotewrite:
        endpoint: http://{{ .Release.Name }}-victoria-metrics-single:8428/prometheus/api/v1/write
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/tempo]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [loki]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [prometheusremotewrite]

# docker-registry subchart (stable/docker-registry, aliased as registry).
registry:
  replicaCount: 1
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""    # empty = cluster default StorageClass
  storage: filesystem
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

# Tempo — distributed tracing backend. Receives OTLP traces from the collector.
tempo:
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""    # empty = cluster default StorageClass
  tempo:
    retention: 48h
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

# Loki — log aggregation backend (SingleBinary with PVC persistence).
# For S3/GCS object storage, see `loki.loki.storage`.
loki:
  deploymentMode: SingleBinary
  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 20Gi
      storageClass: ""    # empty = cluster default StorageClass
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0
  loki:
    useTestSchema: true
    storage:
      bucketNames:
        chunks: chunks
        ruler: ruler

# VictoriaMetrics single-server — metrics backend. Receives OTLP metrics from the collector.
victoria:
  server:
    persistentVolume:
      enabled: true
      size: 20Gi
      storageClassName: ""    # empty = cluster default StorageClass
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

# Grafana — unified dashboards (auto-provisioned datasources).
# adminPassword empty (default) → the Grafana subchart generates a random
# 40-char password and stores it in a Secret named <release>-grafana.
# Retrieve it with:
#   kubectl get secret -n <ns> <release>-grafana -o jsonpath="{.data.admin-password}" | base64 -d ; echo
# Set an explicit password only in non-production or when you have a secret
# management workflow that rotates it.
grafana:
  adminPassword: ""
  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource
