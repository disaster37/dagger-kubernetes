{{- if .Values.supervisor.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
{{- with .Values.supervisor.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
{{- end }}
---
# The supervisor only manages engine StatefulSets, Services, ConfigMaps,
# PVCs, Pods and (optionally) Secrets within its own fleet namespace
# (= the release namespace). A namespaced Role is sufficient and avoids
# granting cluster-wide read/write access to every Secret in the cluster
# (CWE-250 / CWE-269). Set `supervisor.serviceAccount.clusterScope: true`
# only if you run engine fleets across multiple namespaces.
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.supervisor.serviceAccount.clusterScope }}
kind: ClusterRole
{{- else }}
kind: Role
{{- end }}
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}
  {{- if not .Values.supervisor.serviceAccount.clusterScope }}
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  {{- end }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # configmaps also covers the supervisor's public Minting CA trust-bundle
  # ConfigMap (<fullname>-minting-ca-bundle) reconciliation (ca.minting_ca_configmap).
  # Secrets: the supervisor mints per-engine client certs from the minting
  # CA and stores them in Secrets. It also creates/updates/deletes the
  # per-run check/workflow env Secrets (and replaces them on rerun), so
  # `delete` is required (CWE-269 blast radius is bounded by the namespaced
  # Role unless supervisor.serviceAccount.clusterScope is enabled).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Cloud Checks / workflow runners create and cancel batch/v1 Jobs.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.supervisor.serviceAccount.clusterScope }}
kind: ClusterRoleBinding
{{- else }}
kind: RoleBinding
{{- end }}
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}
  {{- if not .Values.supervisor.serviceAccount.clusterScope }}
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  {{- end }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ if .Values.supervisor.serviceAccount.clusterScope }}ClusterRole{{ else }}Role{{ end }}
  name: {{ include "dagger-kubernetes.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dagger-kubernetes.fullname" . }}
    namespace: {{ include "dagger-kubernetes.namespace" . }}
{{- end }}
