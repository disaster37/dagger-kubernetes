{{- if .Values.auth.tokens }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}-tokens
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
type: Opaque
stringData:
  tokens: |-
{{- range .Values.auth.tokens }}
    {{ . }}
{{- end }}
{{- end }}
{{- if .Values.auth.adminPassword }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}-admin-password
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.auth.adminPassword | quote }}
{{- end }}
{{- if .Values.auth.jwtSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}-jwt
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret: {{ .Values.auth.jwtSecret | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: engine-registry-auth
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.auth.engineToken | default "placeholder" | quote }}
  .dockerconfigjson: {{ .Values.auth.engineDockerConfig | default "e30K" | quote }}
{{- if and .Values.ca.crt .Values.ca.key }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}-minting-ca
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
type: Opaque
stringData:
  ca.crt: {{ .Values.ca.crt | quote }}
  ca.key: {{ .Values.ca.key | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}-tls
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
type: kubernetes.io/tls
{{- with .Values.tls }}
data:
  tls.crt: {{ .crt | b64enc | quote }}
  tls.key: {{ .key | b64enc | quote }}
{{- end }}
