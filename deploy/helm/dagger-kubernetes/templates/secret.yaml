{{- if .Values.supervisor.enabled }}
{{- if .Values.auth.bootstrapAdmin.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}-admin-password
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.auth.bootstrapAdmin.password | quote }}
{{- end }}
{{- if .Values.auth.jwt.secret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}-jwt
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
type: Opaque
stringData:
  secret: {{ .Values.auth.jwt.secret | quote }}
{{- end }}
{{- if .Values.auth.oauth.clientSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}-oauth
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
type: Opaque
stringData:
  client_secret: {{ .Values.auth.oauth.clientSecret | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: engine-registry-auth
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.supervisor.config.cache.authToken | default "placeholder" | quote }}
# .dockerconfigjson is ALREADY base64-encoded (the operator supplies the same
# value a `kubectl create secret docker-registry` would store). It goes into
# `data:` (not `stringData:`) so Kubernetes does NOT base64-encode it a second
# time; the kubelet then decodes it exactly once, so engine pods read raw JSON
# at /etc/dagger/.dockerconfigjson. `e30K` is base64 of `{}`.
data:
  .dockerconfigjson: {{ .Values.supervisor.config.fleet.engineDockerConfig | default "e30K" | quote }}
{{- if and .Values.tls.caCrt .Values.tls.caKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}-minting-ca
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
type: Opaque
stringData:
  ca.crt: {{ .Values.tls.caCrt | quote }}
  ca.key: {{ .Values.tls.caKey | quote }}
{{- end }}
# When tls.caCrt/tls.caKey are empty (the default), the minting CA is NOT
# rendered here: the supervisor auto-bootstraps it on first boot (ordinal 0
# generates a goca CA and writes it to <release>-minting-ca; other pods poll
# it). No manual certificate generation is required. Only set them to bring an
# existing CA (e.g. migrating from a prior deployment).
{{- if and .Values.tls.crt .Values.tls.key }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}-tls
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.tls.crt | b64enc | quote }}
  tls.key: {{ .Values.tls.key | b64enc | quote }}
{{- end }}
{{- end }}
