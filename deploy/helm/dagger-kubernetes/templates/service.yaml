{{- if .Values.supervisor.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dagger-kubernetes.supervisorHeadlessService" . }}
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.supervisorLabels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "dagger-kubernetes.supervisorSelectorLabels" . | nindent 4 }}
  ports:
    - name: raft
      port: 8081
      targetPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}-control
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.supervisorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.service.control.type }}
  selector:
    {{- include "dagger-kubernetes.supervisorSelectorLabels" . | nindent 4 }}
  ports:
    # The port NAME ("control") is kept for ServiceMonitor, EndpointSlice and
    # F5 NGINX Ingress Controller port-name matching. The numeric targetPort
    # avoids named-port pod lookups, which resolve against an arbitrary
    # selector-matched pod and break when the selector also matches pods that
    # lack that port name.
    - name: control
      port: {{ .Values.service.control.port }}
      targetPort: 8080
      {{- if and (eq .Values.service.control.type "NodePort") .Values.service.control.nodePort }}
      nodePort: {{ .Values.service.control.nodePort }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}-data
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.supervisorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.service.data.type }}
  selector:
    {{- include "dagger-kubernetes.supervisorSelectorLabels" . | nindent 4 }}
  ports:
    # The port NAME ("data") is kept for ServiceMonitor, EndpointSlice and
    # F5 NGINX Ingress Controller port-name matching. The numeric targetPort
    # avoids named-port pod lookups, which resolve against an arbitrary
    # selector-matched pod and break when the selector also matches pods that
    # lack that port name.
    - name: data
      port: {{ .Values.service.data.port }}
      targetPort: 8443
      {{- if and (eq .Values.service.data.type "NodePort") .Values.service.data.nodePort }}
      nodePort: {{ .Values.service.data.nodePort }}
      {{- end }}
{{- end }}
