{{- if .Values.supervisor.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dagger-kubernetes.supervisorHeadlessService" . }}
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "dagger-kubernetes.selectorLabels" . | nindent 4 }}
  ports:
    - name: raft
      port: 8081
      targetPort: raft
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}-control
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.control.type }}
  selector:
    {{- include "dagger-kubernetes.selectorLabels" . | nindent 4 }}
    # Control-plane traffic is routed to the current Raft leader only: all
    # writes (session registration, touches) are leader-applied, and routing
    # everything there avoids follower 503s and lease splits. Each pod labels
    # itself at runtime (observeLeadership) once a leader is elected.
    dagger-kubernetes.io/raft-leader: "true"
  ports:
    - name: http
      port: {{ .Values.service.control.port }}
      targetPort: control
      {{- if and (eq .Values.service.control.type "NodePort") .Values.service.control.nodePort }}
      nodePort: {{ .Values.service.control.nodePort }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}-data
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.data.type }}
  selector:
    {{- include "dagger-kubernetes.selectorLabels" . | nindent 4 }}
    # Data-plane tunnels terminate on the current Raft leader so the tunnel
    # heartbeat can apply lease touches through Raft (followers cannot apply).
    dagger-kubernetes.io/raft-leader: "true"
  ports:
    - name: tls
      port: {{ .Values.service.data.port }}
      targetPort: data
      {{- if and (eq .Values.service.data.type "NodePort") .Values.service.data.nodePort }}
      nodePort: {{ .Values.service.data.nodePort }}
      {{- end }}
{{- end }}
