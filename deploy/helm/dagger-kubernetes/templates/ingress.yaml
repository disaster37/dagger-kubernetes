{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-body-size: {{ .Values.ingress.proxyBodySize | default "64m" | quote }}
    # /v1/engine is a long-lived WebSocket; keep the proxy from closing it.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # F5 NGINX Ingress Controller equivalents (ignored by the community controller):
    nginx.org/ssl-services: "{{ include "dagger-kubernetes.fullname" . }}-control"
    # /v1/engine is a WebSocket: name the upstream Service so the controller
    # proxies the Upgrade (without it, WS handshakes get 400).
    nginx.org/websocket-services: "{{ include "dagger-kubernetes.fullname" . }}-control"
    nginx.org/client-max-body-size: {{ .Values.ingress.proxyBodySize | default "64m" | quote }}
    nginx.org/proxy-read-timeout: "3600s"
    nginx.org/proxy-send-timeout: "3600s"
    # The F5 NGINX Ingress Controller's Service port/endpoint resolution is
    # unreliable (and triggers worker reloads on pod churn); proxy via the
    # ClusterIP instead.
    nginx.org/use-cluster-ip: "true"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      {{- if .secretName }}
      secretName: {{ .secretName }}
      {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "dagger-kubernetes.fullname" $ }}-control
                port:
                  number: {{ $.Values.service.control.port }}
          {{- end }}
    {{- end }}
{{- end }}
