{{- if .Values.ingress.enabled }}
{{- $cacheHost := trim (include "dagger-kubernetes.cachePublicHost" .) }}
{{- $cacheHostInRules := false }}
{{- range .Values.ingress.hosts }}
{{- if eq .host $cacheHost }}
{{- $cacheHostInRules = true }}
{{- end }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
        {{- if $cacheHost }}
        {{- $inTLS := false }}
        {{- range .hosts }}
        {{- if eq . $cacheHost }}
        {{- $inTLS = true }}
        {{- end }}
        {{- end }}
        {{- if not $inTLS }}
        - {{ $cacheHost | quote }}
        {{- end }}
        {{- end }}
      {{- if .secretName }}
      secretName: {{ .secretName }}
      {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "dagger-kubernetes.fullname" $ }}-control
                port:
                  number: {{ $.Values.service.control.port }}
          {{- end }}
    {{- end }}
    {{- if and $cacheHost (not $cacheHostInRules) }}
    - host: {{ $cacheHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dagger-kubernetes.fullname" $ }}-control
                port:
                  number: {{ $.Values.service.control.port }}
    {{- end }}
{{- end }}
