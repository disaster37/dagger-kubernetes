{{- if eq (.Values.tls.provider | default "embedded") "external" }}
{{- if not (and .Values.tls.crt .Values.tls.key) }}
{{- if not (and .Values.tls.certPath .Values.tls.keyPath) }}
{{- fail "tls.provider=external requires either tls.crt + tls.key (rendered into the <fullname>-tls Secret and mounted at /etc/dagger-kubernetes/tls) or tls.certPath + tls.keyPath (operator-managed PEM files). Without a server keypair the supervisor would serve the control plane in cleartext (fail-closed check)." }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.supervisor.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}-config
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
data:
  config.app.yaml: |
    server:
      control_addr: ":8080"
      data_addr: ":8443"
      data_hostname: {{ include "dagger-kubernetes.dataHostname" . | quote }}
      public_url: {{ include "dagger-kubernetes.publicUrl" . | quote }}
    auth:
      internal:
        enabled: true
        tokens_file: "/etc/dagger-kubernetes/tokens"
      bootstrap_admin:
        username: {{ .Values.auth.bootstrapAdmin.username | quote }}
      jwt:
        secret: ""
        access_ttl: {{ .Values.auth.jwt.accessTtl | quote }}
        refresh_ttl: {{ .Values.auth.jwt.refreshTtl | quote }}
      oauth:
        enabled: {{ .Values.auth.oauth.enabled }}
        provider: {{ .Values.auth.oauth.provider | quote }}
        client_id: {{ .Values.auth.oauth.clientId | quote }}
        client_secret: ""
        redirect_url: {{ include "dagger-kubernetes.oauthRedirectUrl" . | quote }}
        allowed_orgs:
{{ toYaml .Values.auth.oauth.allowedOrgs | indent 10 }}
        allowed_teams:
{{ toYaml .Values.auth.oauth.allowedTeams | indent 10 }}
        allowed_groups:
{{ toYaml .Values.auth.oauth.allowedGroups | indent 10 }}
        group_mappings:
{{ toYaml .Values.auth.oauth.groupMappings | indent 10 }}
        default_group: {{ .Values.auth.oauth.defaultGroup | quote }}
        cookie_secure: {{ .Values.auth.oauth.cookieSecure }}
        issuer_url: {{ .Values.auth.oauth.issuerUrl | quote }}
        scopes:
{{ toYaml .Values.auth.oauth.scopes | indent 10 }}
        username_claim: {{ .Values.auth.oauth.usernameClaim | quote }}
        groups_claim: {{ .Values.auth.oauth.groupsClaim | quote }}
        ca_cert_path: {{ if .Values.supervisor.config.fleet.engineCaSecret }}"/etc/ssl/certs/custom-ca.pem"{{ else }}""{{ end }}
      cookie:
        access_name: {{ .Values.auth.cookie.accessName | quote }}
        refresh_name: {{ .Values.auth.cookie.refreshName | quote }}
        secure: {{ .Values.auth.cookie.secure }}
      cors:
        allowed_origins:
{{ toYaml .Values.auth.cors.allowedOrigins | indent 10 }}
    database:
      dir: "/var/lib/dagger-kubernetes"
    raft:
      node_id: ""
      bind_addr: ":8081"
      advertise_addr: ""
      peers: []
      replicas: {{ .Values.supervisor.replicaCount }}
      statefulset_name: {{ include "dagger-kubernetes.supervisorStatefulSetName" . | quote }}
      headless_service: {{ include "dagger-kubernetes.supervisorHeadlessService" . | quote }}
      namespace: {{ include "dagger-kubernetes.namespace" . | quote }}
      cluster_domain: {{ .Values.supervisor.config.raft.clusterDomain | quote }}
      apply_timeout: "5s"
      leader_wait_timeout: "30s"
      snapshot_threshold: 1000
      snapshot_interval: "10m"
      trailing_logs: 256
      tls:
        enabled: {{ .Values.supervisor.config.raft.tls.enabled }}
        dir: ""
        validity: "8760h"
        organization: "dagger-kubernetes-raft"
        ca_cert: ""
        cert: ""
        key: ""
        ca_secret: {{ include "dagger-kubernetes.supervisorRaftCASecret" . | quote }}
        ca_bootstrap: false
        client_auth: {{ .Values.supervisor.config.raft.tls.clientAuth }}
    telemetry:
      collector_url: {{ include "dagger-kubernetes.collectorUrl" . | quote }}
      tempo_url: {{ include "dagger-kubernetes.tempoUrl" . | quote }}
      loki_url: {{ include "dagger-kubernetes.lokiUrl" . | quote }}
      victoria_url: {{ include "dagger-kubernetes.victoriaUrl" . | quote }}
    cache:
      backend: {{ .Values.supervisor.config.cache.backend | quote }}
      registry: {{ include "dagger-kubernetes.cacheRegistry" . | quote }}
      public_host: {{ include "dagger-kubernetes.cachePublicHost" . | quote }}
      internal_addr: {{ include "dagger-kubernetes.cacheInternalAddr" . | quote }}
      auth_token: ""
{{- if .Values.supervisor.config.cache.registries }}
      registries:
{{- range .Values.supervisor.config.cache.registries }}
        - id: {{ .id | quote }}
          internal_addr: {{ .internalAddr | quote }}
          username: {{ .username | quote }}
          password: ""
          {{- with .passwordSecret }}
          password_secret:
            name: {{ .name | quote }}
            key: {{ .key | quote }}
          {{- end }}
{{- end }}
{{- end }}
{{- if eq .Values.supervisor.config.cache.backend "s3" }}
      s3:
        bucket: {{ .Values.supervisor.config.cache.s3.bucket | quote }}
        region: {{ .Values.supervisor.config.cache.s3.region | quote }}
{{- end }}
{{- with .Values.supervisor.config.history }}
    history:
      gc:
        enabled: {{ .gc.enabled }}
        max_age: {{ .gc.maxAge | quote }}
        schedule: {{ .gc.schedule | quote }}
{{- end }}
    fleet:
      namespace: {{ include "dagger-kubernetes.namespace" . | quote }}
      max_replicas_per_version: {{ .Values.supervisor.config.fleet.maxReplicasPerVersion }}
      max_sessions_per_replica: {{ .Values.supervisor.config.fleet.maxSessionsPerReplica }}
      replica_idle_ttl: {{ .Values.supervisor.config.fleet.replicaIdleTtl | quote }}
      version_retention: {{ .Values.supervisor.config.fleet.versionRetention | quote }}
      engine_image_registry: {{ .Values.supervisor.config.fleet.engineImageRegistry | quote }}
      engine_storage_class: {{ .Values.supervisor.config.fleet.engineStorageClass | quote }}
      engine_storage_size: {{ .Values.supervisor.config.fleet.engineStorageSize | quote }}
      engine_pvc_labels:
{{ toYaml .Values.supervisor.config.fleet.enginePvcLabels | indent 8 }}
      engine_cpu_request: {{ .Values.supervisor.config.fleet.engineCPURequest | quote }}
      engine_cpu_limit: {{ .Values.supervisor.config.fleet.engineCPULimit | quote }}
      engine_memory_request: {{ .Values.supervisor.config.fleet.engineMemoryRequest | quote }}
      engine_memory_limit: {{ .Values.supervisor.config.fleet.engineMemoryLimit | quote }}
      engine_termination_grace_seconds: {{ .Values.supervisor.config.fleet.engineTerminationGraceSeconds }}
      engine_pull_policy: {{ .Values.supervisor.config.fleet.enginePullPolicy | quote }}
      engine_privileged: {{ .Values.supervisor.config.fleet.enginePrivileged }}
      engine_node_selector:
{{ toYaml .Values.supervisor.config.fleet.engineNodeSelector | indent 8 }}
      engine_tolerations:
{{ toYaml .Values.supervisor.config.fleet.engineTolerations | indent 8 }}
      engine_extra_args:
{{ toYaml .Values.supervisor.config.fleet.engineExtraArgs | indent 8 }}
      engine_extra_env:
{{ toYaml .Values.supervisor.config.fleet.engineExtraEnv | indent 8 }}
      engine_extra_env_from:
{{ toYaml .Values.supervisor.config.fleet.engineExtraEnvFrom | indent 8 }}
      engine_ca_secret: {{ .Values.supervisor.config.fleet.engineCaSecret | quote }}
      engine_ca_secret_key: {{ .Values.supervisor.config.fleet.engineCaSecretKey | quote }}
      engine_debug: {{ .Values.supervisor.config.fleet.engineDebug }}
      engine_log_format: {{ .Values.supervisor.config.fleet.engineLogFormat | quote }}
      engine_registry_mirrors:
{{ toYaml .Values.supervisor.config.fleet.engineRegistryMirrors | indent 8 }}
    ca:
      minting_ca_secret: {{ include "dagger-kubernetes.fullname" . }}-minting-ca
      client_cert_ttl: {{ .Values.tls.clientCertTtl | quote }}
    tls:
      provider: {{ .Values.tls.provider | default "embedded" | quote }}
      cert_path: {{ include "dagger-kubernetes.controlTLSCertPath" . | quote }}
      key_path: {{ include "dagger-kubernetes.controlTLSKeyPath" . | quote }}
    lease_ttl: {{ .Values.supervisor.config.leaseTtl | quote }}
    version:
      floor: {{ .Values.supervisor.config.version.floor | quote }}
      allowlist:
{{ toYaml .Values.supervisor.config.version.allowlist | indent 8 }}
    cli:
      enabled: {{ .Values.supervisor.config.cli.enabled }}
      cache_dir: {{ .Values.supervisor.config.cli.cacheDir | quote }}
      release_list_ttl: {{ .Values.supervisor.config.cli.releaseListTtl | quote }}
      download_timeout: {{ .Values.supervisor.config.cli.downloadTimeout | quote }}
      upstream:
        releases_url: {{ .Values.supervisor.config.cli.upstream.releasesUrl | quote }}
        download_base: {{ .Values.supervisor.config.cli.upstream.downloadBase | quote }}
        github_token: ""
    log_level: {{ .Values.supervisor.config.logLevel | quote }}
    log_format: {{ .Values.supervisor.config.logFormat | quote }}
{{- with .Values.supervisor.config.otel }}
    otel:
      otlp_endpoint: {{ .otlpEndpoint | quote }}
{{- end }}
{{- end }}
