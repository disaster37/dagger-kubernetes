{{- if eq (include "dagger-kubernetes.dataplaneTLSProvider" .) "external" }}
{{- if not (or .Values.dataCert.enabled (ne (include "dagger-kubernetes.dataTLSSecretName" .) "")) }}
{{- if not (and .Values.supervisor.dataplane.tls.crt .Values.supervisor.dataplane.tls.key) }}
{{- if not (and .Values.supervisor.dataplane.tls.certPath .Values.supervisor.dataplane.tls.keyPath) }}
{{- fail "supervisor.dataplane.tls.provider=external requires either supervisor.dataplane.tls.crt + supervisor.dataplane.tls.key (rendered into the <fullname>-tls Secret and mounted at /etc/dagger-kubernetes/tls) or supervisor.dataplane.tls.certPath + supervisor.dataplane.tls.keyPath (operator-managed PEM files). Without a server keypair the supervisor cannot serve the mTLS data plane (fail-closed check). (dataCert.enabled / dataIngress.tls.secretName auto-wire the mounted data-tls Secret, so they are exempt.)" }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if .Values.supervisor.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}-config
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
data:
  config.app.yaml: |
    server:
      control_addr: ":8080"
      data_addr: ":8443"
      data_hostname: {{ include "dagger-kubernetes.dataHostname" . | quote }}
      public_url: {{ include "dagger-kubernetes.publicUrl" . | quote }}
      max_data_conns: 2048
      internal_control_url: {{ printf "https://%s-control.%s.svc:%v" (include "dagger-kubernetes.fullname" .) (include "dagger-kubernetes.namespace" .) .Values.service.control.port | quote }}
      internal_data_host: {{ printf "%s-data.%s.svc:%v" (include "dagger-kubernetes.fullname" .) (include "dagger-kubernetes.namespace" .) .Values.service.data.port | quote }}
    auth:
      internal:
        enabled: true
        tokens_file: "/etc/dagger-kubernetes/tokens"
      bootstrap_admin:
        username: {{ .Values.auth.bootstrapAdmin.username | quote }}
      jwt:
        secret: ""
        access_ttl: {{ .Values.auth.jwt.accessTtl | quote }}
        refresh_ttl: {{ .Values.auth.jwt.refreshTtl | quote }}
      oauth:
        enabled: {{ .Values.auth.oauth.enabled }}
        provider: {{ .Values.auth.oauth.provider | quote }}
        client_id: {{ .Values.auth.oauth.clientId | quote }}
        client_secret: ""
        redirect_url: {{ include "dagger-kubernetes.oauthRedirectUrl" . | quote }}
        allowed_orgs:
{{ toYaml .Values.auth.oauth.allowedOrgs | indent 10 }}
        allowed_teams:
{{ toYaml .Values.auth.oauth.allowedTeams | indent 10 }}
        allowed_groups:
{{ toYaml .Values.auth.oauth.allowedGroups | indent 10 }}
        group_mappings:
{{ toYaml .Values.auth.oauth.groupMappings | indent 10 }}
        default_group: {{ .Values.auth.oauth.defaultGroup | quote }}
        mapped_group_max_runner_sessions: {{ .Values.auth.oauth.mappedGroupMaxRunnerSessions }}
        admin_groups:
{{ toYaml .Values.auth.oauth.adminGroups | indent 10 }}
        cookie_secure: {{ .Values.auth.oauth.cookieSecure }}
        issuer_url: {{ .Values.auth.oauth.issuerUrl | quote }}
        scopes:
{{ toYaml .Values.auth.oauth.scopes | indent 10 }}
        username_claim: {{ .Values.auth.oauth.usernameClaim | quote }}
        groups_claim: {{ .Values.auth.oauth.groupsClaim | quote }}
        revalidate_interval: {{ .Values.auth.oauth.revalidateInterval | quote }}
        revalidate_grace: {{ .Values.auth.oauth.revalidateGrace | quote }}
        revalidate_fail_open: {{ .Values.auth.oauth.revalidateFailOpen }}
        session_max_age: {{ .Values.auth.oauth.sessionMaxAge | quote }}
        ca_cert_path: {{ if .Values.supervisor.config.fleet.engineCaSecret }}{{ printf "/usr/local/share/ca-certificates/%s" .Values.supervisor.config.fleet.engineCaSecretKey | quote }}{{ else }}""{{ end }}
      cookie:
        access_name: {{ .Values.auth.cookie.accessName | quote }}
        refresh_name: {{ .Values.auth.cookie.refreshName | quote }}
        secure: {{ .Values.auth.cookie.secure }}
      cors:
        allowed_origins:
{{ toYaml .Values.auth.cors.allowedOrigins | indent 10 }}
    attribution:
      project_mappings:
{{ toYaml .Values.supervisor.config.attribution.projectMappings | indent 8 }}
    org:
      default:
        display_name: {{ .Values.supervisor.config.org.default.displayName | quote }}
      default_quotas:
        max_groups:
          soft: {{ .Values.supervisor.config.org.defaultQuotas.maxGroups.soft }}
          hard: {{ .Values.supervisor.config.org.defaultQuotas.maxGroups.hard }}
        max_projects:
          soft: {{ .Values.supervisor.config.org.defaultQuotas.maxProjects.soft }}
          hard: {{ .Values.supervisor.config.org.defaultQuotas.maxProjects.hard }}
        max_members:
          soft: {{ .Values.supervisor.config.org.defaultQuotas.maxMembers.soft }}
          hard: {{ .Values.supervisor.config.org.defaultQuotas.maxMembers.hard }}
        max_concurrent_sessions:
          soft: {{ .Values.supervisor.config.org.defaultQuotas.maxConcurrentSessions.soft }}
          hard: {{ .Values.supervisor.config.org.defaultQuotas.maxConcurrentSessions.hard }}
        max_engines:
          soft: {{ .Values.supervisor.config.org.defaultQuotas.maxEngines.soft }}
          hard: {{ .Values.supervisor.config.org.defaultQuotas.maxEngines.hard }}
        max_cache_bytes:
          soft: {{ .Values.supervisor.config.org.defaultQuotas.maxCacheBytes.soft }}
          hard: {{ .Values.supervisor.config.org.defaultQuotas.maxCacheBytes.hard }}
        max_pipeline_retention: {{ .Values.supervisor.config.org.defaultQuotas.maxPipelineRetention | quote }}
    database:
      dir: "/var/lib/dagger-kubernetes"
    raft:
      node_id: ""
      bind_addr: ":8081"
      advertise_addr: ""
      peers: []
      replicas: {{ .Values.supervisor.replicaCount }}
      statefulset_name: {{ include "dagger-kubernetes.supervisorStatefulSetName" . | quote }}
      headless_service: {{ include "dagger-kubernetes.supervisorHeadlessService" . | quote }}
      namespace: {{ include "dagger-kubernetes.namespace" . | quote }}
      cluster_domain: {{ .Values.supervisor.config.raft.clusterDomain | quote }}
      apply_timeout: "5s"
      leader_wait_timeout: "120s"
      snapshot_threshold: 1000
      snapshot_interval: "10m"
      trailing_logs: 256
      no_snapshot_restore_on_start: {{ .Values.supervisor.config.raft.noSnapshotRestoreOnStart }}
      transport_max_pool: {{ .Values.supervisor.config.raft.transportMaxPool }}
      tls:
        enabled: {{ .Values.supervisor.config.raft.tls.enabled }}
        dir: ""
        validity: "8760h"
        organization: "dagger-kubernetes-raft"
        ca_cert: ""
        cert: ""
        key: ""
        ca_secret: {{ include "dagger-kubernetes.supervisorRaftCASecret" . | quote }}
        ca_bootstrap: false
        client_auth: {{ .Values.supervisor.config.raft.tls.clientAuth }}
    telemetry:
      collector_url: {{ include "dagger-kubernetes.collectorUrl" . | quote }}
      tempo_url: {{ include "dagger-kubernetes.tempoUrl" . | quote }}
      loki_url: {{ include "dagger-kubernetes.lokiUrl" . | quote }}
      victoria_url: {{ include "dagger-kubernetes.victoriaUrl" . | quote }}
    cache:
      s3:
        bucket: {{ include "dagger-kubernetes.s3Bucket" . | quote }}
        region: {{ .Values.supervisor.config.cache.s3.region | quote }}
        endpoint: {{ include "dagger-kubernetes.s3Endpoint" . | quote }}
        use_ssl: {{ .Values.supervisor.config.cache.s3.useSSL }}
        # S3 credentials are NOT rendered here: the supervisor reads them from
        # the engine-s3-auth Secret (keys accessKey/secretKey) via
        # DAGGER_KUBERNETES_CACHE_S3_* env vars. Leave the keys empty.
        access_key: ""
        secret_key: ""
      remote:
        enabled: {{ .Values.supervisor.config.cache.remote.enabled }}
        bucket: {{ .Values.supervisor.config.cache.remote.bucket | quote }}
        prefix: {{ .Values.supervisor.config.cache.remote.prefix | quote }}
        s3_engine_endpoint: {{ .Values.supervisor.config.cache.remote.s3EngineEndpoint | quote }}
        index_path: {{ .Values.supervisor.config.cache.remote.indexPath | quote }}
        ttl: {{ .Values.supervisor.config.cache.remote.ttl | quote }}
        max_bytes: {{ .Values.supervisor.config.cache.remote.maxBytes | int64 }}
        workers: {{ .Values.supervisor.config.cache.remote.workers }}
        pack_max_member_bytes: {{ .Values.supervisor.config.cache.remote.packMaxMemberBytes | int64 }}
        gc_interval: {{ .Values.supervisor.config.cache.remote.gcInterval | quote }}
{{- if .Values.imageCache.enabled }}
    image_cache:
      # external_addr (ADR-046): node-reachable mirror ingress host; routes the
      # fleet engine image when set. tls (ADR-043): marks an HTTPS mirror and,
      # when its host matches fleet.engine_image_registry, routes the engine
      # image through internal_addr as a legacy fallback. tls_ca_path: CA bundle
      # for verifying HTTPS mirrors, mounted by the supervisor StatefulSet from
      # imageCache.tls.caSecretName.
      tls_ca_path: {{ if and .Values.imageCache.tls.enabled .Values.imageCache.tls.caSecretName }}{{ printf "/etc/dagger-kubernetes/image-cache-ca/%s" .Values.imageCache.tls.caSecretKey | quote }}{{ else }}""{{ end }}
      mirrors:
      {{- range (fromYamlArray (include "dagger-kubernetes.imageCacheRegistries" .)) }}
      {{- $addr := include "dagger-kubernetes.imageCacheMirrorAddress" (dict "root" $ "slug" .slug) }}
        - id: {{ .slug | quote }}
          host: {{ .host | quote }}
          upstream: {{ .remoteUrl | quote }}
          internal_addr: {{ $addr | quote }}
          {{- if and (eq .host "registry.dagger.io") (ne (include "dagger-kubernetes.registryMirrorExternalHost" $) "") }}
          external_addr: {{ include "dagger-kubernetes.registryMirrorExternalHost" $ | quote }}
          {{- end }}
          backend: {{ $.Values.imageCache.storage.backend | default "s3" | quote }}
          tls: {{ $.Values.imageCache.tls.enabled }}
      {{- end }}
{{- end }}
{{- with .Values.supervisor.config.history }}
    history:
      gc:
        enabled: {{ .gc.enabled }}
        max_age: {{ .gc.maxAge | quote }}
        schedule: {{ .gc.schedule | quote }}
{{- end }}
    fleet:
      namespace: {{ include "dagger-kubernetes.namespace" . | quote }}
      max_replicas_per_version: {{ .Values.supervisor.config.fleet.maxReplicasPerVersion }}
      max_sessions_per_replica: {{ .Values.supervisor.config.fleet.maxSessionsPerReplica }}
      replica_idle_ttl: {{ .Values.supervisor.config.fleet.replicaIdleTtl | quote }}
      version_retention: {{ .Values.supervisor.config.fleet.versionRetention | quote }}
      engine_image_registry: {{ .Values.supervisor.config.fleet.engineImageRegistry | quote }}
      engine_storage_class: {{ .Values.supervisor.config.fleet.engineStorageClass | quote }}
      engine_storage_size: {{ .Values.supervisor.config.fleet.engineStorageSize | quote }}
      engine_pvc_labels:
{{ toYaml .Values.supervisor.config.fleet.enginePvcLabels | indent 8 }}
      engine_cpu_request: {{ .Values.supervisor.config.fleet.engineCPURequest | quote }}
      engine_cpu_limit: {{ .Values.supervisor.config.fleet.engineCPULimit | quote }}
      engine_memory_request: {{ .Values.supervisor.config.fleet.engineMemoryRequest | quote }}
      engine_memory_limit: {{ .Values.supervisor.config.fleet.engineMemoryLimit | quote }}
      engine_termination_grace_seconds: {{ .Values.supervisor.config.fleet.engineTerminationGraceSeconds }}
      engine_pull_policy: {{ .Values.supervisor.config.fleet.enginePullPolicy | quote }}
      engine_privileged: {{ .Values.supervisor.config.fleet.enginePrivileged }}
      engine_node_selector:
{{ toYaml .Values.supervisor.config.fleet.engineNodeSelector | indent 8 }}
      engine_tolerations:
{{ toYaml .Values.supervisor.config.fleet.engineTolerations | indent 8 }}
      engine_extra_args:
{{ toYaml .Values.supervisor.config.fleet.engineExtraArgs | indent 8 }}
      engine_extra_env:
{{ toYaml .Values.supervisor.config.fleet.engineExtraEnv | indent 8 }}
      engine_extra_env_from:
{{ toYaml .Values.supervisor.config.fleet.engineExtraEnvFrom | indent 8 }}
      engine_ca_secret: {{ .Values.supervisor.config.fleet.engineCaSecret | quote }}
      engine_ca_secret_key: {{ .Values.supervisor.config.fleet.engineCaSecretKey | quote }}
      engine_debug: {{ .Values.supervisor.config.fleet.engineDebug }}
      engine_log_format: {{ .Values.supervisor.config.fleet.engineLogFormat | quote }}
      engine_registry_mirrors:
{{ include "dagger-kubernetes.engineRegistryMirrors" . | indent 8 }}
      # Mirror host[:port] values dialed over plaintext HTTP; engine.json
      # emits registries["<mirror>"].http = true per entry.
      engine_registry_mirrors_http:
{{ include "dagger-kubernetes.imageCacheMirrorHosts" . | indent 8 }}
      isolation: {{ .Values.supervisor.config.fleet.isolation | quote }}
    ca:
      minting_ca_secret: {{ printf "%s-minting-ca" (include "dagger-kubernetes.fullname" .) | quote }}
      minting_ca_configmap: {{ include "dagger-kubernetes.supervisorMintingCAConfigMap" . | quote }}
      client_cert_ttl: {{ .Values.supervisor.dataplane.tls.clientCertTtl | quote }}
    supervisor:
      dataplane:
        tls:
          provider: {{ include "dagger-kubernetes.dataplaneTLSProvider" . | quote }}
          cert_path: {{ include "dagger-kubernetes.dataplaneTLSCertPath" . | quote }}
          key_path: {{ include "dagger-kubernetes.dataplaneTLSKeyPath" . | quote }}
    lease_ttl: {{ .Values.supervisor.config.leaseTtl | quote }}
    version:
      floor: {{ .Values.supervisor.config.version.floor | quote }}
      allowlist:
{{ toYaml .Values.supervisor.config.version.allowlist | indent 8 }}
    cli:
      enabled: {{ .Values.supervisor.config.cli.enabled }}
      release_list_ttl: {{ .Values.supervisor.config.cli.releaseListTtl | quote }}
      download_timeout: {{ .Values.supervisor.config.cli.downloadTimeout | quote }}
      s3_bucket: {{ include "dagger-kubernetes.s3Bucket" . | quote }}
      s3_prefix: {{ .Values.supervisor.config.cli.s3Prefix | quote }}
      upstream:
        releases_url: {{ .Values.supervisor.config.cli.upstream.releasesUrl | quote }}
        download_base: {{ .Values.supervisor.config.cli.upstream.downloadBase | quote }}
        github_token: ""
      include_prereleases: {{ .Values.supervisor.config.cli.includePrereleases }}
    log_level: {{ .Values.supervisor.config.logLevel | quote }}
    log_format: {{ .Values.supervisor.config.logFormat | quote }}
{{- with .Values.supervisor.config.otel }}
    otel:
      otlp_endpoint: {{ .otlpEndpoint | quote }}
      ingest_max_body_size: {{ .ingestMaxBodySize | default 67108864 | int64 }}
      max_inflight_bytes: {{ .maxInflightBytes | default 268435456 | int64 }}
{{- end }}
    checks:
      enabled: {{ .Values.supervisor.config.checks.enabled }}
      namespace: {{ default (include "dagger-kubernetes.namespace" .) .Values.supervisor.config.checks.namespace | quote }}
      job_image: {{ default (printf "%s:%s" .Values.supervisor.image.repository (.Values.supervisor.image.tag | default .Chart.AppVersion)) .Values.supervisor.config.checks.jobImage | quote }}
      job_image_pull_secrets:
        {{- $checksPullSecrets := .Values.supervisor.config.checks.jobImagePullSecrets | default .Values.supervisor.image.pullSecrets }}
        {{- if $checksPullSecrets }}
        {{- range $checksPullSecrets }}
        - {{ .name | quote }}
        {{- end }}
        {{- else }} []
        {{- end }}
      timeout: {{ .Values.supervisor.config.checks.timeout | quote }}
      github_oidc_issuer: {{ .Values.supervisor.config.checks.githubOidcIssuer | quote }}
      gitlab_oidc_issuer: {{ .Values.supervisor.config.checks.gitlabOidcIssuer | quote }}
      oidc_audience: {{ .Values.supervisor.config.checks.oidcAudience | quote }}
      silent: {{ .Values.supervisor.config.checks.silent }}
    workflows:
      enabled: {{ .Values.supervisor.config.workflows.enabled }}
      namespace: {{ default (include "dagger-kubernetes.namespace" .) .Values.supervisor.config.workflows.namespace | quote }}
      job_image: {{ default (printf "%s:%s" .Values.supervisor.image.repository (.Values.supervisor.image.tag | default .Chart.AppVersion)) .Values.supervisor.config.workflows.jobImage | quote }}
      job_image_pull_secrets:
        {{- $workflowsPullSecrets := .Values.supervisor.config.workflows.jobImagePullSecrets | default .Values.supervisor.image.pullSecrets }}
        {{- if $workflowsPullSecrets }}
        {{- range $workflowsPullSecrets }}
        - {{ .name | quote }}
        {{- end }}
        {{- else }} []
        {{- end }}
      default_timeout: {{ .Values.supervisor.config.workflows.defaultTimeout | quote }}
      max_parallel: {{ .Values.supervisor.config.workflows.maxParallel }}
      silent: {{ .Values.supervisor.config.workflows.silent }}
      {{- with .Values.supervisor.config.workflows.discoveryPaths }}
      discovery_paths:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      {{- end }}
    forge:
      github_api_url: {{ .Values.supervisor.config.forge.githubApiUrl | quote }}
      gitlab_api_url: {{ .Values.supervisor.config.forge.gitlabApiUrl | quote }}
      gitea_api_url: {{ .Values.supervisor.config.forge.giteaApiUrl | quote }}
      webhook_secret: ""
      github:
        allowed_api_urls: {{ .Values.supervisor.config.forge.github.allowedApiUrls | toJson }}
        ca_cert_path: {{ .Values.supervisor.config.forge.github.caCertPath | quote }}
        http_timeout: {{ .Values.supervisor.config.forge.github.httpTimeout | quote }}
        oauth:
          enabled: {{ .Values.supervisor.config.forge.github.oauth.enabled }}
          client_id: {{ .Values.supervisor.config.forge.github.oauth.clientId | quote }}
          client_secret: ""
          oauth_base_url: {{ .Values.supervisor.config.forge.github.oauth.oauthBaseUrl | quote }}
          scopes: {{ .Values.supervisor.config.forge.github.oauth.scopes | toJson }}
          state_ttl: {{ .Values.supervisor.config.forge.github.oauth.stateTtl | quote }}
          device_flow_enabled: {{ .Values.supervisor.config.forge.github.oauth.deviceFlowEnabled }}
          allowed_redirect_uris: {{ .Values.supervisor.config.forge.github.oauth.allowedRedirectUris | toJson }}
    graphql:
      introspection_enabled: {{ .Values.supervisor.config.graphql.introspectionEnabled }}
      max_depth: {{ .Values.supervisor.config.graphql.maxDepth }}
      max_selections: {{ .Values.supervisor.config.graphql.maxSelections }}
      max_query_bytes: {{ .Values.supervisor.config.graphql.maxQueryBytes }}
      max_parallelism: {{ .Values.supervisor.config.graphql.maxParallelism }}
      log_queries: {{ .Values.supervisor.config.graphql.logQueries }}
{{- with .Values.supervisor.config.pipeline }}
    pipeline:
      metrics:
        enabled: {{ .metrics.enabled }}
        step: {{ .metrics.step | quote }}
        rate_window: {{ .metrics.rateWindow | quote }}
        record_interval: {{ .metrics.recordInterval | quote }}
        max_record_window: {{ .metrics.maxRecordWindow | quote }}
{{- end }}
---
# Helm-owned shell for the public Minting CA trust bundle (certificates only,
# key ca.crt). The leader supervisor keeps data.ca.crt in sync on bootstrap and
# through phased rotation via ca.minting_ca_configmap; Gateway API
# BackendTLSPolicy reads it as a Core caCertificateRef.
#
# CRITICAL: when supervisor.dataplane.tls.caCrt is empty, omit `data:` entirely
# (never render `data: {}` or `ca.crt: ""`). Under Helm's 3-way strategic merge
# patch, a manifest with no `data` field produces zero patch diff on `data`
# during `helm upgrade`, preserving the supervisor's runtime-written ca.crt.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dagger-kubernetes.supervisorMintingCAConfigMap" . }}
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
{{- if .Values.supervisor.dataplane.tls.caCrt }}
data:
  ca.crt: {{ .Values.supervisor.dataplane.tls.caCrt | quote }}
{{- end }}
{{- end }}
