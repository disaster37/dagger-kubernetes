{{- if .Values.service.data.ingress.enabled }}
# ---------------------------------------------------------------------------
# NGINX Ingress TCP passthrough configuration for the data plane.
#
# This ConfigMap must be applied in the NGINX Ingress Controller's namespace
# (e.g. nginx-ingress). Helm cannot cross-namespace resources, so this
# manifest is generated for manual or scripted application.
#
# After applying this ConfigMap, also expose the TCP port on the NGINX
# Ingress Controller's Deployment and Service:
#
#   kubectl -n <ingress-ns> patch svc <ingress-svc> --type json -p \
#     '[{"op":"add","path":"/spec/ports/-","value":{"name":"data-tcp","port":{{ .Values.service.data.ingress.port }},"protocol":"TCP","targetPort":{{ .Values.service.data.ingress.port }}}}]'
#
#   kubectl -n <ingress-ns> patch deploy <ingress-deploy> --type json -p \
#     '[{"op":"add","path":"/spec/template/spec/containers/0/ports/-","value":{"name":"data-tcp","containerPort":{{ .Values.service.data.ingress.port }},"protocol":"TCP"}}]'
# ---------------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-tcp-services
  namespace: {{ .Values.service.data.ingress.namespace | default "nginx-ingress" }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
data:
  "{{ .Values.service.data.ingress.port }}": {{ include "dagger-kubernetes.namespace" . }}/{{ include "dagger-kubernetes.fullname" . }}-data:{{ .Values.service.data.port }}
{{- end }}