{{- if and .Values.supervisor.autoscaling.enabled (gt (int .Values.supervisor.config.raft.replicas) 1) }}
{{- fail "supervisor.autoscaling is only safe with supervisor.config.raft.replicas=1 (single-node Raft). Scaling a multi-replica Raft cluster with an HPA can disturb quorum and cause availability loss. Set supervisor.config.raft.replicas=1 (and supervisor.replicaCount=1) or disable supervisor.autoscaling." }}
{{- end }}
{{- if and .Values.supervisor.enabled .Values.supervisor.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ include "dagger-kubernetes.fullname" . }}
  minReplicas: {{ .Values.supervisor.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.supervisor.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.supervisor.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.supervisor.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.supervisor.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.supervisor.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
