{{- if and .Values.supervisor.enabled .Values.supervisor.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "dagger-kubernetes.fullname" . }}
  minReplicas: {{ .Values.supervisor.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.supervisor.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.supervisor.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.supervisor.autoscaling.targetCPUUtilizationPercentage }}
    {{- end }}
    {{- if .Values.supervisor.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.supervisor.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
{{- end }}
