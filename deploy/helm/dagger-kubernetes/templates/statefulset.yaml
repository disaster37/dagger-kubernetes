{{- if .Values.supervisor.enabled }}
{{- if and .Values.supervisor.autoscaling .Values.supervisor.autoscaling.enabled }}
{{- fail "supervisor.autoscaling was removed: a quorum-based Raft cluster cannot follow HPA-driven scaling (quorum disturbance on scale-down, split-brain single-voter clusters on scale-out). Delete the supervisor.autoscaling keys from your values; the Raft voter count follows supervisor.replicaCount." }}
{{- end }}
{{- if hasKey .Values.supervisor.config.raft "replicas" }}
{{- fail "supervisor.config.raft.replicas was removed: the Raft voter count is now derived from supervisor.replicaCount (each supervisor pod is one Raft voter). Delete the supervisor.config.raft.replicas key from your values." }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "dagger-kubernetes.supervisorHeadlessService" . }}
  podManagementPolicy: Parallel
  replicas: {{ .Values.supervisor.replicaCount }}
  selector:
    matchLabels:
      {{- include "dagger-kubernetes.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dagger-kubernetes.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.supervisor.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "dagger-kubernetes.fullname" . }}
      {{- with .Values.supervisor.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.supervisor.podSecurityContext | nindent 8 }}
      containers:
        - name: supervisor
          image: "{{ .Values.supervisor.image.repository }}:{{ .Values.supervisor.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.supervisor.image.pullPolicy }}
          args:
            - "--config=/etc/dagger-kubernetes/config.app.yaml"
          env:
            - name: DAGGER_KUBERNETES_LOG_LEVEL
              value: {{ .Values.supervisor.config.logLevel | quote }}
            # Stable node ID = StatefulSet pod name (<sts>-<ordinal>), which
            # matches the DNS peer IDs derived from the fixed
            # raft.statefulset_name / headless_service config.
            - name: DAGGER_KUBERNETES_RAFT_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DAGGER_KUBERNETES_RAFT_REPLICAS
              value: {{ .Values.supervisor.replicaCount | quote }}
            - name: DAGGER_KUBERNETES_RAFT_TLS_ENABLED
              value: {{ .Values.supervisor.config.raft.tls.enabled | quote }}
            - name: DAGGER_KUBERNETES_RAFT_TLS_CLIENT_AUTH
              value: {{ .Values.supervisor.config.raft.tls.clientAuth | quote }}
            {{- if or .Values.auth.bootstrapAdmin.password .Values.auth.bootstrapAdmin.secretRef.name }}
            - name: DAGGER_KUBERNETES_AUTH_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.bootstrapAdmin.secretRef.name | default (printf "%s-admin-password" (include "dagger-kubernetes.fullname" .)) }}
                  key: {{ .Values.auth.bootstrapAdmin.secretRef.key | default "password" }}
            {{- end }}
            {{- if or .Values.auth.jwt.secret .Values.auth.jwt.secretRef.name }}
            - name: DAGGER_KUBERNETES_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.jwt.secretRef.name | default (printf "%s-jwt" (include "dagger-kubernetes.fullname" .)) }}
                  key: {{ .Values.auth.jwt.secretRef.key | default "secret" }}
            {{- end }}
            {{- if or .Values.auth.oauth.clientSecret .Values.auth.oauth.clientSecretRef.name }}
            - name: DAGGER_KUBERNETES_AUTH_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.oauth.clientSecretRef.name | default (printf "%s-oauth" (include "dagger-kubernetes.fullname" .)) }}
                  key: {{ .Values.auth.oauth.clientSecretRef.key | default "client_secret" }}
            {{- end }}
            {{- if .Values.supervisor.config.fleet.engineCaSecret }}
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/custom-ca.pem
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/ssl/certs/custom-ca.pem
            {{- end }}
            {{- with .Values.supervisor.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: control
              containerPort: 8080
            - name: data
              containerPort: 8443
            - name: raft
              containerPort: 8081
          volumeMounts:
            - name: config
              mountPath: /etc/dagger-kubernetes/config.app.yaml
              subPath: config.app.yaml
              readOnly: true
            {{- if and .Values.tls.crt .Values.tls.key }}
            - name: tls
              mountPath: /etc/dagger-kubernetes/tls
              readOnly: true
            {{- end }}
            {{- if or .Values.dataCert.enabled .Values.dataIngress.tls.secretName }}
            - name: data-tls
              mountPath: /etc/dagger-kubernetes/data-tls
              readOnly: true
            {{- end }}
            - name: db
              mountPath: /var/lib/dagger-kubernetes
            - name: tmp
              mountPath: /tmp
            {{- if .Values.supervisor.config.fleet.engineCaSecret }}
            - name: ca-bundle
              mountPath: /etc/ssl/certs/custom-ca.pem
              subPath: ca.crt
              readOnly: true
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: control
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: control
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.supervisor.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.supervisor.securityContext | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "dagger-kubernetes.fullname" . }}-config
        {{- if and .Values.tls.crt .Values.tls.key }}
        - name: tls
          secret:
            secretName: {{ include "dagger-kubernetes.fullname" . }}-tls
        {{- end }}
        {{- if or .Values.dataCert.enabled .Values.dataIngress.tls.secretName }}
        - name: data-tls
          secret:
            secretName: {{ .Values.dataIngress.tls.secretName | default .Values.dataCert.secretName | default (printf "%s-data-tls" (include "dagger-kubernetes.fullname" .)) }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.supervisor.config.fleet.engineCaSecret }}
        - name: ca-bundle
          secret:
            secretName: {{ .Values.supervisor.config.fleet.engineCaSecret }}
        {{- end }}
        {{- if not .Values.supervisor.persistence.enabled }}
        - name: db
          emptyDir: {}
        {{- end }}
      {{- with .Values.supervisor.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.supervisor.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.supervisor.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.supervisor.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: db
        labels:
          {{- include "dagger-kubernetes.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.supervisor.persistence.size | quote }}
        {{- with .Values.supervisor.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
  {{- end }}
{{- end }}
