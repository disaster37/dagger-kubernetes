apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dagger-kubernetes.fullname" . }}
  namespace: {{ include "dagger-kubernetes.namespace" . }}
  labels:
    {{- include "dagger-kubernetes.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "dagger-kubernetes.supervisorHeadlessService" . }}
  podManagementPolicy: Parallel
  replicas: {{ .Values.supervisor.replicaCount }}
  selector:
    matchLabels:
      {{- include "dagger-kubernetes.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dagger-kubernetes.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.supervisor.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "dagger-kubernetes.fullname" . }}
      {{- with .Values.supervisor.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.supervisor.podSecurityContext | nindent 8 }}
      containers:
        - name: supervisor
          image: "{{ .Values.supervisor.image.repository }}:{{ .Values.supervisor.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.supervisor.image.pullPolicy }}
          args:
            - "--config=/etc/dagger-kubernetes/config.app.yaml"
          env:
            - name: DAGGER_KUBERNETES_LOG_LEVEL
              value: {{ .Values.supervisor.config.logLevel | quote }}
            - name: DAGGER_KUBERNETES_DATABASE_DIR
              value: {{ .Values.supervisor.config.database.dir | quote }}
            # Stable node ID = StatefulSet pod name (<sts>-<ordinal>), which
            # matches the DNS peer IDs derived from raft.statefulset_name.
            - name: DAGGER_KUBERNETES_RAFT_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DAGGER_KUBERNETES_RAFT_BIND_ADDR
              value: {{ .Values.supervisor.config.raft.bindAddr | quote }}
            - name: DAGGER_KUBERNETES_RAFT_ADVERTISE_ADDR
              value: {{ .Values.supervisor.config.raft.advertiseAddr | quote }}
            - name: DAGGER_KUBERNETES_RAFT_REPLICAS
              value: {{ .Values.supervisor.config.raft.replicas | quote }}
            - name: DAGGER_KUBERNETES_RAFT_STATEFULSET_NAME
              value: {{ include "dagger-kubernetes.supervisorStatefulSetName" . | quote }}
            - name: DAGGER_KUBERNETES_RAFT_HEADLESS_SERVICE
              value: {{ include "dagger-kubernetes.supervisorHeadlessService" . | quote }}
            - name: DAGGER_KUBERNETES_RAFT_NAMESPACE
              value: {{ include "dagger-kubernetes.namespace" . | quote }}
            - name: DAGGER_KUBERNETES_RAFT_CLUSTER_DOMAIN
              value: {{ .Values.supervisor.config.raft.clusterDomain | quote }}
            - name: DAGGER_KUBERNETES_RAFT_TLS_ENABLED
              value: {{ .Values.supervisor.config.raft.tls.enabled | quote }}
            - name: DAGGER_KUBERNETES_RAFT_TLS_CA_SECRET
              value: {{ include "dagger-kubernetes.supervisorRaftCASecret" . | quote }}
            - name: DAGGER_KUBERNETES_RAFT_TLS_CA_BOOTSTRAP
              value: {{ .Values.supervisor.config.raft.tls.caBootstrap | quote }}
            - name: DAGGER_KUBERNETES_RAFT_TLS_CLIENT_AUTH
              value: {{ .Values.supervisor.config.raft.tls.clientAuth | quote }}
            {{- if .Values.auth.adminPassword }}
            - name: DAGGER_KUBERNETES_AUTH_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dagger-kubernetes.fullname" . }}-admin-password
                  key: password
            {{- end }}
            {{- if .Values.auth.jwtSecret }}
            - name: DAGGER_KUBERNETES_AUTH_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "dagger-kubernetes.fullname" . }}-jwt
                  key: secret
            {{- end }}
            {{- if .Values.auth.oauthClientSecret }}
            - name: DAGGER_KUBERNETES_AUTH_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "dagger-kubernetes.fullname" . }}-oauth
                  key: client_secret
            {{- end }}
            {{- with .Values.supervisor.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: control
              containerPort: 8080
            - name: data
              containerPort: 8443
            - name: raft
              containerPort: 8081
          volumeMounts:
            - name: config
              mountPath: /etc/dagger-kubernetes/config.app.yaml
              subPath: config.app.yaml
              readOnly: true
            - name: tokens
              mountPath: /etc/dagger-kubernetes/tokens
              subPath: tokens
              readOnly: true
            - name: tls
              mountPath: /etc/dagger-kubernetes/tls
              readOnly: true
            {{- if or .Values.dataCert.enabled .Values.dataIngress.tls.secretName }}
            - name: data-tls
              mountPath: /etc/dagger-kubernetes/data-tls
              readOnly: true
            {{- end }}
            - name: db
              mountPath: /var/lib/dagger-kubernetes
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz
              port: control
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: control
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.supervisor.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.supervisor.securityContext | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "dagger-kubernetes.fullname" . }}-config
        - name: tokens
          secret:
            secretName: {{ include "dagger-kubernetes.fullname" . }}-tokens
            optional: true
        - name: tls
          secret:
            secretName: {{ include "dagger-kubernetes.fullname" . }}-tls
        {{- if or .Values.dataCert.enabled .Values.dataIngress.tls.secretName }}
        - name: data-tls
          secret:
            secretName: {{ .Values.dataIngress.tls.secretName | default .Values.dataCert.secretName | default (printf "%s-data-tls" (include "dagger-kubernetes.fullname" .)) }}
        {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if not .Values.supervisor.persistence.enabled }}
        - name: db
          emptyDir: {}
        {{- end }}
      {{- with .Values.supervisor.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.supervisor.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.supervisor.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.supervisor.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: db
        labels:
          {{- include "dagger-kubernetes.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.supervisor.persistence.size | quote }}
        {{- with .Values.supervisor.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
  {{- end }}
