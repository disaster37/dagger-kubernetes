name: release
"on":
  release:
    types:
      - created
jobs:
  publish-docker:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: dagger/dagger-for-github@v7
        name: Publish Docker Image
        with:
          args: -m './dagger' --src '.' publish --version ${{ github.ref_name }} --registry-username ${{ github.actor }} --registry-password 'env:REGISTRY_PASSWORD'
          module: "./dagger"
          verb: call
          version: ""
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
