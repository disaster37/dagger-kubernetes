name: release
"on":
  release:
    types:
      - created
jobs:
  publish-docker:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    env:
      DAGGER_VERSION: "0.21.8"
    steps:
      - uses: actions/checkout@v2
      - name: Install Dagger CLI
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=${DAGGER_VERSION} BIN_DIR=/usr/local/bin sh
      - name: CI gate
        run: dagger call -m ./dagger --src . ci export --path out
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
  publish-helm:
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    env:
      DAGGER_VERSION: "0.21.8"
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Install Dagger CLI
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=${DAGGER_VERSION} BIN_DIR=/usr/local/bin sh
      - name: Publish Helm Chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          BRANCH_NAME="${{ github.event.release.target_commitish }}"
          dagger call -m github.com/disaster37/dagger-library-go/helm@2.0.10 \
            --src deploy/helm/dagger-kubernetes ci \
            --ci github \
            --registry ghcr.io \
            --version "${VERSION}" \
            --registry-username "${{ github.actor }}" \
            --registry-password "env:GITHUB_TOKEN" \
            --git-token "env:GITHUB_TOKEN" \
            --git-repo-url "${{ github.repositoryUrl }}" \
            --git-branch "${BRANCH_NAME}" \
            export --path .
