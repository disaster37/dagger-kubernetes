name: Release

on:
  release:
    types: [created]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Helm README version
        env:
          REGISTRY: ghcr.io
          VERSION: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          bash scripts/update-helm-docs.sh "${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/dagger-kubernetes/README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: bump Helm README version to ${VERSION}"
          git push origin HEAD:refs/heads/main
