# Supervisor runtime configuration.
#
# Only deployment-specific values are listed here. Every other option falls
# back to the compiled-in defaults in config/loader.go. To see the
# full set of options with explanations, copy config/config.app.yaml.sample to
# config/config.app.yaml and edit from there.
#
# Any value below can also be overridden by an environment variable using the
# DAGGER_CACHE_ prefix, e.g. DAGGER_CACHE_LOG_LEVEL=debug or
# DAGGER_CACHE_CACHE_BACKEND=s3. Environment variables take precedence over
# this file.

# --- Endpoints & public URLs (set these per deployment) ----------------------
server:
  control_addr: ":8080"        # Hertz control API (TLS enabled when cert/key configured)
  data_addr: ":8443"            # mTLS L4 data-plane proxy
  data_hostname: "data.supv.example.com"
  public_url: "https://supv.example.com"

# --- Authentication ----------------------------------------------------------
auth:
  internal:
    tokens_file: "/etc/dagger-cache/tokens"   # DEPRECATED legacy fallback; migrate with `supervisor migrate-tokens` then remove.
  bootstrap_admin:
    username: "admin"                         # created on first boot when no users exist.
    password: ""                               # empty = random password logged once at first boot.
  jwt:
    secret: ""                                 # HS256 signing key (>= 32 bytes, enforced); empty = auto-generated and persisted in the DB.
    access_ttl: "15m"
    refresh_ttl: "168h"
  oauth:                                       # optional; disabled by default. Single active provider per deployment.
    enabled: false
    provider: "github"                        # "github" | "oidc" (generic OIDC: Dex, Keycloak, Google, Auth0, ...).
    client_id: "${OAUTH_CLIENT_ID}"
    client_secret: "${OAUTH_CLIENT_SECRET}"
    redirect_url: "https://supv.example.com/api/v1/auth/oauth/github/callback"
    allowed_orgs: ["acme"]                    # github: org membership; oidc: groups-claim intersection; empty = allow all.
    default_group: ""                         # new OAuth users auto-join this group (must exist); empty = none.
    cookie_secure: false                      # force the Secure flag on the oauth_state cookie (set true when TLS terminates in front of the supervisor).
    # OIDC-only fields (provider: oidc). Ignored when provider: github.
    issuer_url: ""                            # e.g. "https://dex.example.com"; loopback http allowed for dev.
    scopes: ["openid", "profile", "email"]    # "openid" is always included.
    username_claim: "preferred_username"      # fallback: "email"; error if both absent.
    groups_claim: "groups"                    # claim holding group names; array or single string; absent = no groups.

# --- Database ----------------------------------------------------------------
database:
  dir: "/var/lib/dagger-cache"  # Raft data dir (raft.db, snapshots/, node-id). Fresh-start store: no migration from legacy SQLite.

# --- Raft (distributed store) ------------------------------------------------
raft:
  node_id: ""                  # "" = load/generate a stable UUID at <dir>/node-id.
  bind_addr: ":8081"           # dedicated Raft transport port (not control/data).
  advertise_addr: ""           # "" = derive from <hostname>.<headless_service>.<namespace>.svc.<cluster_domain>.
  peers: []                    # single-node default (self is the only voter).
  replicas: 1                  # StatefulSet replica count for DNS peer discovery.
  statefulset_name: ""         # e.g. "dagger-cache-supervisor" (DNS discovery).
  headless_service: ""         # e.g. "dagger-cache-headless" (DNS discovery).
  namespace: ""                # K8s namespace for pod DNS (default = release ns).
  cluster_domain: "cluster.local"
  apply_timeout: "5s"
  leader_wait_timeout: "30s"
  snapshot_threshold: 1000
  snapshot_interval: "10m"
  trailing_logs: 256
  tls:
    enabled: false             # binary default. Helm chart sets true (mTLS).
    dir: ""                    # "" = <database.dir>/tls
    validity: "8760h"
    organization: "dagger-cache-raft"
    ca_cert: ""                # manual mode: path to CA cert PEM.
    cert: ""                   # manual mode: path to leaf cert PEM.
    key: ""                    # manual mode: path to leaf key PEM.
    ca_secret: ""              # auto/K8s mode: Secret name for CA sharing.
    ca_bootstrap: false        # auto/K8s mode: this node generates the CA (auto-detects ordinal 0).
    client_auth: true          # mTLS (RequireAndVerifyClientCert).

# --- Remote shared cache -----------------------------------------------------
cache:
  backend: "registry"               # "registry" (OCI) or "s3"
  registry: "cache.reg/dagger-cache" # OCI repository for BuildKit cache blobs
  gc:                                # auto-clean (GC) sweeper for cache blobs.
    enabled: false                   # master switch; disabled by default.
    max_age: "168h"                  # purge tags older than this (7d).
    schedule: "1h"                   # background sweeper ticker interval.
    min_refs_to_keep: 3              # always keep at least this many most-recent tags per version.
    protect_active_versions: true    # never purge tags for versions with active fleet replicas.

# --- Pipeline history retention ------------------------------------------------
history:
  gc:                                 # auto-purge of trace_meta + logs + metrics (see ADR-018).
    enabled: false                     # master switch; disabled by default.
    max_age: "720h"                    # purge traces whose last update is older than this (30d).
    schedule: "1h"                     # background sweeper ticker interval.

# --- Pipeline disconnect detection --------------------------------------------
pipeline:
  disconnect_grace: "0s"               # 0s = fail immediately on tunnel close (default).
  stale_sweep:
    enabled: true                      # supervisor-restart / crash recovery sweeper.
    schedule: "1m"
    stale_after: "5m"

# --- Allowed Dagger engine versions ------------------------------------------
version:
  floor: "v0.19.0"                          # minimum supported engine
  allowlist: ["0.19", "0.20", "0.21"]       # major.minor prefixes to admit
